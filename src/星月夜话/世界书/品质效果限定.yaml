---
品质效果限定:
  普_(普通): 
    定位: 日常用品·基础装备
    属性加成: 无
    特殊效果: 无
    耐久: 低
    可强化: 否
    市场流通: 公开·普通商店
    示例: 普通刀具·基础符咒·简易药剂
  良_(优秀):
    定位: 精良装备·炼金制品
    属性加成: +1单项属性
    特殊效果: 1个轻微效果(夜间微光·轻微保暖·轻微魔力增幅)
    耐久: 中
    可强化: 可强化至稀_(需稀_材料)
    市场流通: 限定商店·黑市
    示例: 精钢匕首·稳定符咒·高效恢复药
  稀_(稀有):
    定位: 高级装备·咒术产物
    属性加成: +2单项属性或+1两项属性
    特殊效果: 1~2个显著效果(魔力护盾·诅咒抗性·自动修复)
    耐久: 高
    可强化: 可强化至史_(需史_材料+特殊条件)
    市场流通: 黑市拍卖·势力内部·家族传承
    示例: 退魔刀·封印符·变身挂坠
  史_(史诗):
    定位: 传说级装备·唯一物品
    属性加成: +3单项属性或+2两项属性
    特殊效果: 2~3个强大效果(领域展开·诅咒吸收·能力复制)
    耐久: 极高(通常不可破坏)
    可强化: 否(已经是巅峰)
    市场流通: 不可能(唯一·剧情绑定)
    示例: 朱雀炎刃·星光之杖·深渊封印器
