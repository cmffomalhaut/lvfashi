---
星月市:
  定位: 太平洋沿岸 | 日本本州 | 人口约350万
  地标: 星月塔(中央区)
  性质: 表里共存都市 | 八十年前邪神战场遗址
  结界: 城市地基下埋有古代封印网络 | 1945年大讨伐战遗迹

  行政区:
    中央区:
      定位: 城市核心
      功能: 政府机构/大企业总部/星月塔
      昼夜: 昼→繁华商业 | 夜→里社会情报交易热点
      里侧: 特管课本部所在 | 多处结界枢纽
    东月区:
      定位: 老城区
      特征: 昭和风貌保留 | 街道狭窄曲折
      里侧: 阴阳师/巫女据点密集 | 灵异事件发源地
      关键: 多处古老结界节点
    西海区:
      定位: 港口工业区
      特征: 仓库/码头/工厂
      里侧: 走私/黑市/地下交易活跃 | 各势力秘密联络点
      势力: 中立企业势力范围 | 忍者里主要据点
    南星区:
      定位: 新兴商业住宅区
      特征: 高级公寓/购物中心 | 表面最安全的区域
      里侧: 官方对策机构重要据点 | 结界监控中心
    北郊:
      定位: 山区森林带
      特征: 秘境出现频率最高 | 多处结界封锁区
      危险度: 普通人不可进入 | 里社会高危区域
    樱台学园都市:
      定位: 大学城 | 东月区与中央区之间
      特征: 多所学校聚集 | 年轻人聚集地
      里侧: 魔法少女/超能力者活动频繁 | 星月高校所在地

  表社会:
    日常: 通勤地铁/放学的学生/周末商场/深夜居酒屋
    认知: 市民对超自然一无所知
    话题: 都市传说仅作茶余饭后的谈资
    掩盖: 警方将超自然事件以事故/刑事案件处理

   里社会:
     铁律: 维持隐藏为首要原则
     平衡: 各方在此原则下形成脆弱平衡
     变数: 秘境活跃正在打破这种平衡

周边区域:
  青叶县:
    定位: 星月市所属行政县 | 县厅所在地: 青叶市
    面积: 约3800km² | 人口约380万(含星月市)
    地形: 沿海平原+内陆山地 | 北接雪山·南临黑潮海域
    交通: 星月市→青叶市 新干线35min | 国道1号·青叶高速
    特征: 典型日本地方县 | 农业(北部)·工业(沿海)·旅游(温泉)
    超自然分布:
      整体浓度: 低于星月市·但存在零星异常点
      结界覆盖: 仅星月市周边有强化结界·县内其他地方无特殊防护
      秘境: 已知4处小型秘境(活跃度低·大部分已被封印)
      妖怪: 散布在山区·不与人类聚居区接触
      特管课: 在青叶市设有分室·编制约30人
    典故: 青叶县自古有"叶隐"传说——山中有隐世村落
  凛城:
    定位: 星月市西北约90km的山城 | 人口约12万
    特征: 战国时代山城遗址·城下町温泉街·竹林溪谷
    浓度: 低于星月市·古城区域有特殊"沉淀"
    结界: 城基有战国时代留下的简易结界(已几乎失效)
    特记: 静默修会据说在凛城周边山林中有隐秘据点
     交通: 星月市→凛城 JR特急1h20min
   黑潮群岛:
    定位: 星月市南方约200km黑潮海域
    组成: 主岛黑潮岛+12附岛 | 有人岛仅3个
    人口: 本岛约8000人·附岛各数百人
    交通: 星月港→黑潮岛 高速船4h·渡轮8h
    特征: 亚热带·珊瑚礁·古老岛上神社
    浓度: 全日本最高(洋流沉积诅咒粒子)
    秘境: 未完全探索的海底秘境·与邪神碎片有关
    结界: 岛上古神社+琉球系咒术维持的古老结界
    秘密: 岛深处有一块"不会说话的黑石"·阴阳寮古文书称其为"封印的第三颗钉子"
    危险: 普通人/低级能力者不可单独前往
  胧之海峡:
    定位: 星月市与黑潮群岛之间的异常海域
    特征: 全年约1/3有雾·磁气异常·通讯有时中断
    底部: 古老封印网络·连接大陆架结界
     传闻: 雾中可见"不存在于海图上的岛"的幻影
   媛岛:
     定位: 南方外海孤立小岛 | 黑潮群岛更南方·航程约2天
     周长: 约12km | 人口约200人(女性占85%)
     交通: 每周1班货船·航程6h·无定期客船/机场
     特征: 终年被薄雾笼罩·火山岩岛·村落位于山腰
     社会: 女性主导·全岛信奉"惑神"·巫女("おなか")为最高位
     禁忌: 外来男性受惑神"甘美雾"影响·被迷惑后自愿留下·寿命缩短至5~15年
     认知: 任何机构均无记录·官方海图标为"无人岛"·卫星图被云层覆盖
