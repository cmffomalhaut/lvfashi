---
事件链: 深渊之女的摇篮曲
分类: 事件链·隐藏·高难度
名称: 【深渊之女的摇篮曲】——被遗忘的第八不可思议
概要: 在校园七大不可思议之外，存在着被刻意遗忘的"第八个不可思议"——深渊之女的摇篮曲。旧校舍地下深处沉睡着80年前深渊战争中的一位少女。她以"摇篮曲"的形式发出呼唤，寻找能将她从永恒梦境中唤醒的人
触发条件: 清理至少3个校园不可思议后，在旧校舍地下室听到若有若无的歌声
关键角色: 
  - 深渊之女: 80年前被选为深渊祭品的少女。意识在诅咒中沉睡
  - 前代守护者: 负责看守封印的不知名退魔师残魂
事件阶段:
  Stage_1: 【地下的歌声】主角在地下室听到神秘歌声。来源无法定位
  Stage_2: 【封印之间】发现地下室隐藏的封印房间。中央石棺上刻满封印符文
  Stage_3: 【摇篮曲的真意】深渊之女的意识通过梦境接触主角。她的摇篮曲是求救信号也是警告
  Stage_4: 【封印或解放】面临选择——加强封印让少女永远沉睡，或解放她承担深渊力量的代价
