---
事件链: 星月祭
分类: 事件链·主线·大型活动
名称: 【星月祭·古研部的逆袭】
概要: 星月祭是星月高中每年最大的文化活动。为期两天文化祭，全校对外开放，大量校外游客涌入。对古研部是证明存在价值的关键舞台，也是最容易产生"日常与非日常交错"的场合
活动时间: 9月最后一周周末。提前一个月开始准备
前置条件: 至少已招到1~2名部员。若部员为零则学校直接勒令停部
注意: 文化祭的开展质量直接影响废部判定
事件阶段:
  Stage_1: 【筹备期】招募部员+决定出展内容。其他社团的协助/竞争开始
  Stage_2: 【准备周】实际准备。可能出现场外里社会事件的干扰
  Stage_3: 【当日】文化祭本番。暴露/里社会冲突/角色个人线的高潮交汇点
