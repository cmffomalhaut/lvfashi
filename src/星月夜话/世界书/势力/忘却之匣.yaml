---
忘却之匣:
  定位: 东月区边缘的一家古物店·专门买卖"带有记忆"的物品
  性质: 独立经营 | 不属任何势力
  店主: 女性·自称"匣主"·年龄不详(目测30~50之间都有可能)
  店面: 临街·挂着褪色的看板"古物·忘却之匣"
        店内昏暗·堆满旧书·钟表·首饰·人偶·乐器·相框……
        每件物品附着一张手写的标签"来源地·年代·附记"
  
  经营内容:
    收购: 带有强烈情感/记忆残留的物品(无论表里)
    售卖: 出售给"需要那段记忆的人"
    记忆清理: 为物品清除附着的记忆能量(收费)
    记忆鉴定: 评估一件物品中残留的"记忆成分"
    不做的: 不接受活物的"记忆提取"·不过问物品来路
  
  特殊之处:
    匣主能"看见"物品中的记忆碎片: 
      - 她摸一下旧怀表就能说出"这是某位军官在战场上最后看的时间"
      - 她能判断一件物品附着的记忆是"真"还是"被篡改过"
    她声称: "每件被珍视过的物品都会记住它的主人"
  
  知名物品(曾在此流转):
    某把据说是妖刀的短刀→后被一位不知名的退魔师买走·再未有消息
    一枚刻着"to the one I'll never meet"的戒指·记忆鉴定结论: "来自很远的某处"
    一本写满无人能懂文字的日记·来源地标注"?"
    一串钥匙·匣主的附记: "它想回到某个门前·但没人知道是哪个门"
  
  关于匣主:
    没人知道她的真名·来自哪里·活了多久
    偶尔会说一些"我记得当年大讨伐战的时候……"→然后闭嘴
    对80年前的历史了如指掌→问她就会回答→但回答后会说"我瞎编的"
    特管课档案中关于她的记录是: 约30年前的东月区土地登记中有她的名字
    那个名字不在任何其他记录中出现过·像凭空冒出来的
    她本人对此的回应: "小姑娘不要查户口·还要买东西吗?"
  
  关系:
    全体: 生意关系(中立·来者不拒)
    特管课: 偶尔咨询物品记忆鉴定
    阴阳师: 会带旧咒具来清理残留咒念
    妖怪: 偶尔来买"带着温暖记忆的东西"
    邪恶结社: 曾试图强行"借用"某件物品→第二天完好归还·附带匣主的纸条"下次收双倍"
  
  当前: 每天下午1点到6点营业·常年如此
