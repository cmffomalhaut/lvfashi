---
特管课(内阁情报调查室·星月特管课):
  全称: 内阁情报调查室 星月特管课
  定位: 政府超自然事件专门对策机构
  原则: 最小干预 | 维持表里障壁为首要
  等级: 观察员→介入官→特任官→管理官
  编制: 约200人(含后勤)
  预算: 国家机密预算 | 不受一般会计审计

  组织架构:
    管理官: 黒鉄義輝(总负责人)
    特任官: 朝霧真白(最年轻的天才)
    总务科: 行政/预算/对外协调
    观测科: 灵子雷达/结界监控/数据分析
    介入科: 现场应对/事件压制/掩盖
    情报科: 里社会情报收集/分析
    技术科: 对超自然装备研发/维护
    掩盖班: 伪造事故现场/目击者记忆操作

  装备:
    灵力检测器(便携式) | 灵子雷达(大范围)
    结界监控网络(覆盖全市) | 记忆干扰装置
    对超自然特殊弹头 | 封印结界发生器
    数据库: 已知所有势力/能力者档案

  掩盖流程:
    1_现场封锁(以刑事案件/瓦斯泄漏名义)
    2_目击者控制(记忆干扰/签署保密协议)
    3_证据回收(超自然痕迹消除)
    4_公开说明(统一口径)

  据点:
    中央区·政府大楼地下三层(本部)
    各区警察署内(联络办公室)
    南星区(结界监控中心)

  关系:
    正式合作: 阴阳师 | 教会
    监管合作: 魔法少女(非正式)
    情报买卖: 忍者里
    监视: 所有势力(数据库持续更新)
    打击: 邪恶结社 | 邪神崇拜者
    登记: 超能力者(部分已登记)

  当前动向:
    - 大结界数值出现异常波动
    - 警戒等级提升至"黄"
    - 追查星之钥匙下落
    - 追查超能力者失踪事件
