---
漂流邮便局:
  定位: 里社会的非官方邮政与信息递送服务
  性质: 完全中立·不参与任何势力斗争·仅做好本职工作
  别称: "局""漂流屋"
  服务范围: 星月市全域·部分周边地区·少数秘境入口
  规模: 约30名邮差(自称"漂流人")+若干个中转站
  
  服务内容:
    普通信件/包裹递送(表里均接)
    加密信息传递(使用自研的"漂流码")
    跨势力物资转运(不检查内容·不拆封)
    秘境物品代取(高风险·收费高昂)
    "最后的信": 某人预感自己将死时寄存的信→漂流局会在其死亡后送达目标
  
  规则:
    - 不拆任何委托物
    - 不透露寄件人/收件人信息
    - 委托物丢失/损毁→漂流局按价赔付(从不赖账)
    - 不运送: 活物·明显危险的咒物·被通缉的人
    - 不接受追踪委托物来源/去向的要求
  
  据点形态: 不是固定邮局
    而是在各区的"信任店铺"设置邮筒
    每天不同时间收件·路线随机
    邮差之间不知道彼此的全貌(防截获)
  
  历史:
    起源: 约50年前·由一名自称"老漂流"的神秘人物创立
    传承: 现任"局长"是第三代·身份保密
    战争考验: 在血色情人节事件中·漂流局成功运送了各方的情报和物资→战后各方公认其"不可触碰"
  
  关系:
    全体: 商业合作伙伴(保持严格中立)
    特管课: 默认许可(因为漂流局运送效率比特管课自己的渠道还高)
    邪恶结社: 彼此利用·漂流局不关心结社运什么
    暗网黑市: 部分业务重合但互补
    武斗会/拍卖会: 官方合作物流
  
  当前动向:
    - 筹备开设"秘境快递"业务(探索秘境的同时运送物资)
    - 招募新人邮差(要求: 体力好·方向感强·嘴巴紧)
