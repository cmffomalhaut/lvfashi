---
惑神:
  称号: 媛岛的诱饵 | 甘美牢笼 | 梦中的雾
  定位: 极弱小的地域性邪神 | 仅存在于孤岛的封闭村落
  性质: 力量极弱·但精于精神魅惑和感官迷惑
        它无法直接伤害任何人→它让他们"不想离开"
  状态: 稳定·与岛上村落形成共生的微妙平衡
  真名: 已无人知晓·岛上仅称"大人"或"岛神"
  
  地理位置:
    所在: 远离星月市·南方外海中的一座小岛
    岛名: 媛岛 | 周长约12km | 人口约200人
    交通: 每周有一班货船从附近港口出发·航程约6h
          岛上无机场·无定期客船
          通讯: 无手机信号·仅有岛上唯一一部卫星电话(常"故障")
    地图: 媛岛在官方海图上存在·但标注为"无人岛·无定期航线"
          旧时曾有过渔业活动·但"早已废弃"
          实际上岛上有人居住·但约80年前开始刻意回避外界
    景观: 被雾气笼罩的火山岩岛屿·中央有死火山口
          港口废弃·只有一条石阶路通往山腰的村落
          村落后方的山坡上有小型神社
          岛南部有一片黑砂海滩·北部是悬崖
          终年多雾·即使在晴朗日子也能看到薄雾笼罩
  
  岛屿生态(受惑神影响):
    植被: 茂密但色调偏暗·深绿色阔叶林
    动物: 少·只有海鸟和野兔(传统上不吃四足兽)
    气候: 亚热带·全年温暖·但湿度极高
    特殊: 岛上的雾气常年不散·从外海看岛总像"隔着一层薄纱"
          这种雾气是惑神力量的延伸——它降低了外来者的警惕心
  
  惑神的能力(极弱·但有特色):
    力量范围: 仅覆盖媛岛全域及周边约1km海域
    核心能力——"甘美雾":
      - 进入岛屿范围内的外来者会感到难以名状的安心感
      - 警惕心逐渐降低·批判力钝化·越来越觉得"这里挺好的"
      - 对男性的效果是女性的2~3倍
      - 离开岛屿范围后效果逐渐消退(约1~3天完全恢复)
      - 但如果长期(超过1周)暴露·会在心理留下"故乡般"的依恋
        即使离开也会想回去
    辅助能力:
      - 遮蔽: 让卫星图像上的岛屿区域总被云层覆盖
      - 记忆模糊: 离开者对岛上的具体经历记忆不清·只记得"很舒服"
      - 健康压抑: 抑制岛上居民的重病感知·让他们觉得"没事"
    致命能力: 无·它太弱了
    能量来源: 岛上居民对其的信仰(虽粗糙但持续)
              以及外来男性被"吸收"的生命力
  
  惑神的本质——它是什么?
    推测1: 媛岛古时有一位女性巫女因爱而不得·投海自尽
           其执念与岛上的土地神融合→产生了以"挽留"为本能的惑神
    推测2: 原本是岛屿的土地神·在江户时代接触了某艘漂流船上的外来诅咒
           →被污染后扭曲·产生了"留住所有人"的执念
    真相: 已不可考·岛上也没有文字记录留下
          惑神本身可能也已经不记得自己曾经是什么
  
  媛岛的社会结构(独特):
    人口构成: 约200人·女性占约85%·男性极少且全是"外来的"
    语言: 有岛上的古老方言·但能说标准日本语
    信仰: 全岛信奉惑神(神社位于村落后方山坡)
    巫女(神子):
      称谓: "おなか" (O-naka·意为"正中"——人与神的中介)
      每代1名·由上一代巫女临终前指定
      身份地位: 全岛最高·是惑神在人间的话语人
      特殊规则: 巫女不与普通男性交合
                仅在特定"神仪"中与"被惑神选定"的男性交合
                这种男性通常是最新到来的外来者中最"特别"的一个
                这种交合被视为最高的供奉行为·被称为"神合"
                巫女一生可能仅有1~2次神合
      巫女的真实状态:
        表面: 端庄的祭祀者·村落的指引者
        实际: 只有巫女最清楚地知道惑神的存在和真相
              她维持着村落与惑神之间的平衡
              她也是唯一能"清醒"地看待这一切的人
    其他女性:
      分为"岛女"(土生土长)和"留女"(被留下的外来女性·极少)
      岛女从十几岁开始参与"接待"外来男性
      她们认为这是自然的·正常的·是"岛的方式"
      她们对男性温柔·照顾·体贴
      在男人的视角: 这里的女人太好了·太温柔了·不想走了
    外来男性:
      到达途径:
        - 少数是货船船员偶然靠岸(惑神让雾引导他们)
        - 极少数是海难漂流者
        - 偶尔有听说媛岛"有美女"传闻而好奇找到的冒险者
      被惑神影响后的经历:
        第1~3天: "这座岛好舒服·人好好·先待几天"
        第1~2周: 开始和岛上的女性建立关系·大多乐不思蜀
        第1~3月: 已经完全融入·不想离开·"外面有什么好的"
      寿命: 外来男性的寿命通常只有5~15年
            原因: 惑神缓慢吸取他们的生命气息·维持岛屿的"繁荣"
            他们不会感到痛苦·甚至不会意识到自己在衰老
            死因通常被记录为"心脏麻痹"或"衰老"
            去世时往往面容安详
  
  村里生活的表面:
    经济: 渔业·少许农耕(番薯·蔬菜)·手工盐
          物物交换为主·很少用钱
    日常: 缓慢·平静·充满日常的温柔
          女人们织网·做饭·照顾孩子·去神社参拜
          男人们(外来者)被安排做轻体力活(他们其实很愿意)
          夜晚: 岛上的夜总是温暖而宁静·充满低声细语
    给外来者的幻觉: "这里就是桃源乡"
  
  村里生活的真相:
    惑神的雾一直在影响每一个人
    女性们并不觉得自己被"控制"——她们真心认为这就是生活
    外来者也不觉得自己被"欺骗"——他们真心觉得这里很好
    巫女知道真相·但她认为"维持现状对所有人都是最好的"
    偶尔有外来者产生怀疑→惑神的雾会加重→让他"想通了"
    真正无法被迷惑的人几乎不存在(惑神的魅惑对普通人近乎绝对)
    但如果真有这样的人出现:
      巫女会亲自与他谈话·给他选择
      选择留下→会得到最好的待遇(包括"神合"的可能)
      选择离开→巫女会确保他安全离开·但惑神的力量会影响他
      离开后他可能想回来·也可能忘记·也可能在梦中反复见到媛岛的雾
  
   与其他势力的关系:
     外界: 完全不存在·媛岛在世界上没有任何记录
     海图: 官方海图标注为"无人岛·无定期航线"
           没有任何异常备注·没有任何档案记录
     黑潮群岛: 是离媛岛最近的"有人区域"·航程约2天
              黑潮群岛的老人偶有"不要去媛岛那边"的传说
              但被当作无根据的老人口传·没有任何人认真对待
     任何官方机构: 完全不知道媛岛的真实情况
                  卫星图像总被云层覆盖·偶尔拍到也看不出有人居住的痕迹
                  没有任何一级机构有任何相关记录
     其他势力: 完全不存在·媛岛不在任何势力的认知范围内
   
  剧本素材可能性:
    A: 有外来者从媛岛逃出·但无人相信他的经历
    B: 主角因某件事必须去媛岛(寻找某件物品/某个人)
    C: 巫女向外界发出求救信号(岛屿平衡可能正在被打破)
    D: 惑神的力量在衰减·岛上的"雾"正在变薄
