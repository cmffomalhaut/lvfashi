---
街角食堂:
  定位: 东月区小巷深处的一家定食屋·里社会唯一的非武装中立区
  性质: 非正式中立地带 | 店内禁止一切争斗
  店名: "街角食堂"·挂着褪色的暖帘·招牌只写了"食堂"二字
  店主: 一位约60岁的女性·被称为"婆婆"(本名不详)
  店员: 仅2人(帮厨+跑堂)·都是普通人类·对里世界一无所知
  
  特殊地位:
    不成立的约定: 任何势力不得在食堂内或食堂门前动手
    违者后果: 不只是被婆婆赶出去这么简单
      ① 该势力会被"食堂屏除名单"→所有成员不再被服务
      ② 屏除=在里社会的某种"名誉劣化"
      ③ 历史上仅有3人违反→后来都因为各种原因退出了里社会
      ④ 没人知道婆婆是怎么做到的
  
  菜单(有名无实·每日不同):
    定食: 500円(含味增汤+渍物)
    咖喱: 600円
    乌龙面: 450円
    啤酒: 350円
    "今日推荐": 不定期(有时不收钱)
  
  作为情报交换所:
    食堂是唯一各方成员可面对面坐下的地方
    在这里交换情报、谈条件、甚至相亲
    谈话不加密·因为没人敢在这里设窃听器
    婆婆会偶尔插嘴·提供看似无关但一针见血的"建议"
  
  里社会功能:
    约见陌生人: 食堂是首选(放心不会被阴)
    休战谈判: 在此进行的停火协议从未被撕毁过
    新消息散布: "某某在食堂说了什么"=里社会快报
  
  婆婆其人:
    外貌: 普通老妇人·灰白短发·围裙
    传闻: 50年前曾是某个大势力的顶级人物
          也有人说她根本就是几十年来一直这样
          真实: 没人知道·也没人敢问
    态度: 对所有客人一视同仁·收钱找零从不拖沓
  
  关系:
    所有势力: 表面上是"普通餐饮店"·实际上是里社会的润滑剂
    特管课: 曾派员暗查→结论"确实只是普通食堂"→实际上特管干部也常来吃
    客人: 妖/阴阳师/魔法少女/结社成员/特管课员→可能坐在邻桌各自吃面
