---
星月暗夜格斗赛(地下武斗会):
  定位: 里社会最火爆的非法格斗赛事
  性质: 每月一次 | 秘密场地 | 无规则(除禁止杀人)
  主办: "主持人"(真实身份不明·永远戴歌剧面具)
  成立: 约10年前

  参赛者来源:
    魔法少女(匿名参赛·伪装) | 忍者(实战试炼)
    武道家(流派切磋·不受武藏会约束) | 超能力者(最多)
    异界人(展示异世界格斗术) | 特管课特工(化了伪装)
    普通人(极少·完全不知情的倒霉鬼)

  等级制度:
    青铜(新人/基础级) | 白银(中级) | 黄金(上级)
    钻石(精英级) | 王者(卫冕冠军·星月暗夜王者)
    升级: 累计胜场数晋升 | 黄金级以上需击败同级对手
    降级: 连续三场败北→降一级

  赛制:
    常规赛: 一对一淘汰制 | 每月一次
    特殊赛(不定期):
      - 混合双打(两人组队)
      - 道具赛(允许使用主办方提供的特殊武器)
      - 诅咒解放战(允许主动引动体内诅咒·一年一次)
    王者挑战赛: 连胜十场→获得挑战现任王者资格

  赌盘:
    由忍者里+暗网黑市联合运营
    下注方式: 现金/加密货币/情报
    赔率: 根据选手历史战绩和今日状态实时变动
    特殊赌注: 选手可以在赛前对自己下注(以提高分成)

  败者代价:
    金钱支付(标准)
    情报提供(以情报抵债)
    "服从契约": 在规定时间内为胜者服务(赛前约定)
    身体代价: 极少数特殊赛事的败者处罚(里社会灰色地带)

  规则:
    禁止即死级攻击(违者永久除名+交特管课)
    赛前签署"后果自负"同意书
    胜者获得全部赌注70% | 主办方抽成30%
    连胜十场→挑战现任王者

  关键人物:
    "主持人": 主办者·面具遮面
    「黄龙」: 黄金级格斗家·现任卫冕冠军·流派不明

  关系:
    合作: 忍者里(赌盘) | 暗网黑市(直播/下注)
    表面反对: 武藏会(暗中关注·视为弟子实战试炼场)
    参赛: 超能力者(最多参赛群体)
    观战: 几乎所有势力(均有成员)
