---
妖怪·星月市的非人存在:
  定位: 自古以来存在的灵性存在
  性质: 无统一组织 | 各有领地规则
  种类: 极为丰富(无害~极危险)
  分布: 星月市各处灵地/废弃建筑/地下空间/北郊山林
  总人口: 无法统计(含潜伏在人类社会的化形者)
  对人类态度: 大多不感兴趣 | 领地受侵犯时暴怒

  分类体系:
    大妖: 匹敌顶级魔法使 | 隐居灵地 | 有领地意识
      - 山翁: 北郊最年长的大妖·不主动与人类为敌
      - 九尾(传说): 是否真实存在未知
    付丧神: 器物百年成精 | 大多无害 | 部分可交流
    野怪/杂鬼: 低阶 | 数量最多 | 凭本能行动
    化形者: 可化人形 | 混入人类社会生活
    食人鬼: 极危险 | 阴阳师/魔法少女优先清除对象

  能力特征:
    种类不同能力不同
    部分可化人形(需要长期维持)
    大妖拥有独特领域/结界
    对灵力/圣力有天然弱点

  领地规则:
    大妖各自划定势力范围
    低等妖怪在夹缝中生存
    人类聚居区(中央区/南星区)妖怪稀少
    东月区/北郊为妖怪主要活动区
    入侵大妖领地=宣战

  关系:
    敌对: 阴阳师(但有互不侵犯协议的大妖存在) | 巫女 | 魔法少女
    被驱使: 邪恶结社(部分)
    中立: 异界人(时竞争)
    灵活: 诸夏天师(视具体情况)

  当前动向:
    - 灵脉异常导致低阶妖怪活动频繁
    - 各地灵异事件急剧增加
    - 大妖们也在观察局势变化
