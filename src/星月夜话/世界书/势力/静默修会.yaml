---
静默修会(Silent Oratorio):
  定位: 极端净化组织 | 隐秘教会式架构 | 无固定据点
  别称: "无语派""沉默祈祷者"
  目标: 彻底消除世间一切超自然力量·回归"纯净的人类世界"
  核心理念:
    - 所有超自然力量=邪神诅咒的残渣·理应清除
    - 术者/妖/秘境/诅咒→都是污染源
    - 使用超自然力量=在以自己的灵魂喂养诅咒
    - 最终愿景: 一个没有魔法·没有咒术·没有妖怪·只有人类的世界
  信条: "言即咒·默即净"
  
  起源:
    形成时期: 约20年前
    起源: 大讨伐战后创伤最严重的幸存者及其后代
    创始人: 一位在大讨伐战中失去全家的阴阳师·匿名"寂"
    分裂: 曾为特管课的前身机构一员→因理念激进而被逐出
    传承: 未公开招募·通过渗透和私下接触吸纳
  
  组织特征(无实体):
    无总部·无据点·不集会
    成员通过"静默网络"联系(死信点·加密频道·接头暗语)
    每个成员仅知道上下线各一人(细胞式结构)
    不存在"叛徒"(因为没人知道全貌)
  招募方式: 不公开·通过观察认为合适的人→秘密接触
  
  成员背景:
    超自然灾难受害者/家属
    极端保守派宗教人士
    对里社会感到厌倦而想"终结一切"的原能力者
    具有强烈正义感但手段极端的普通人
  
  行动方式:
    肃清行动: 消灭他们认为"不可救药"的诅咒造物/禁术使用者
    封印破坏: 攻击他们认为"不应该维持"的秘境/结界
    资料销毁: 窃取并销毁禁忌知识记录
    证据伪造: 制造假象嫁祸给其他势力(最近一起使邪恶结社和特管课冲突升级)
  特征: 现场不留活口·不留痕迹·偶尔留下拉丁文"PURGANDUM"(当净)
  
  关系网络:
    敌对: 几乎所有超自然势力(都是"清除对象")
    极度敌对: 邪恶结社 | 邪神崇拜者(优先清除目标)
    敌对但克制: 特管课·阴阳师·魔法少女(虽有理念冲突·但承认他们尚未"堕落")
    未知: 机械黎明会(尚未注意到这个新势力)
    评价: 特管课内部将静默修会列为"不可控的第三极"
  
  当前动向:
    - 正在策划针对某个大型秘境的"永久封闭行动"(具体目标不明)
    - 渗透情报推测: 他们可能获得了某个封印孔的位置信息
    - 特管课已在各结界枢纽加强戒备
    - 与邪恶结社武装冲突频率上升(双方互有损失)
