---
月影之友会:
  定位: 知情普通市民互助网络
  性质: 非战斗人员后勤支援 | 表里社会桥梁
  规模: 约300名成员(分散全城)
  创始: 「月見亭」店主(酒吧·主要联络点)
  核心原则: "不该看的不看 | 不该问的不问"

  成员构成:
    医生/护士(提供非法诊疗·不记录)
    律师(法律掩护·处理超自然事件法律擦边球)
    出租车司机(移动哨兵·人员转运)
    便利店店员(物资补给·安全屋钥匙传递)
    记者(橘凛子·情报收集·新闻压制)
    酒吧老板(「月見亭」交流站)
    房产中介(安全屋提供)

  支援内容:
    情报: 表社会动态/可疑人物目击/警方动向
    物资: 药品/食物/武器(有限度)
    医疗: 非法诊疗(不能去正规医院的能力者)
    庇护: 安全屋/逃亡路线
    掩盖: 伪造不在场证明/销毁痕迹

  暗号系统:
    识别标志: 特定颜色的山茶花(每周更换)
    联络暗语: 日常对话中嵌入(如"今晚月色很美"=有情况)
    紧急信号: 特定位置涂鸦(红色○=危险·不可接近)
    成员之间: 只在必要时接触·单线联系

  关键人物:
    マスター: 「月見亭」店主·创始成员
    橘凛子: 星月日报记者·情报提供

  关系:
    暗中支援: 魔法少女(最频繁)
    部分合作: 特管课(有限度·不暴露身份)
    有限援助: 所有非敌对势力
    警惕: 邪恶结社(避免接触)
    拒绝: 邪神崇拜者(绝不同情)

  当前动向:
    - 发现有人冒充月影之友会暗语诈骗
    - 正在追查冒名者
    - 为近期受伤的魔法少女提供秘密医疗
