---
契约之源:
  定位: 魔法少女的力量来源
  性质: 某种高位存在或规则集合体(本质不明)
  形态: 无固定形态·以"光""声音""感觉"等形式被感知
  契约者: 仅选择少女(理由不明·可能与诅咒亲和力有关)
  契约数量: 约30~50份同时有效(星月市)
  位置: 未知(不在物理空间内·推测在次元夹层)

  契约流程:
    1_缘分: 被契约之源主动选中(不可预测)
    2_召唤: 少女在危机时听到"声音"→引导至契约空间
    3_选择: 根据内心最强烈的愿望→获得对应武装
    4_变身: 通过特定咒语/动作→变身(获得力量+防护)
    5_绑定: 从此魔力与契约之源连接(不可解除)

  契约武装:
    反映契约者内心(不是愿望而是本质)
    武器型: 剑/弓/杖/铳/鞭(性格外向者居多)
    装甲型: 强化服/屏障/护盾(守护型性格)
    召唤型: 使魔/精灵/武器独立行动(创造型)
    特殊型: 时间/空间/治愈/感知(极少数)

  契约等级:
    契约深度决定力量上限
    青铜: 基础变身·物理强化
    白银: 武装解放·获得特有技能
    黄金: 二段变身·魔力大幅提升
    水晶: 接近契约之源·获得规则级能力
    传说: 与契约之源产生共鸣·可以短暂"借用"其力量

  契约风险:
    魔力耗尽→变身解除+虚弱状态(可能昏迷)
    过度使用→魔力透支→契约不稳定(罕见)
    精神创伤→契约可能自动解除(记忆也同步模糊)
    契约之源的目的: 不明(无人知道它为什么选择契约者)

  与诅咒的关系:
    契约之力可能与诅咒同源(或互为表里)
    契约少女的诅咒亲和力→转换为魔力
    这也是为什么魔法少女只在星月市存在的原因之一

  关联条目: 魔法少女 | 超自然力量体系
