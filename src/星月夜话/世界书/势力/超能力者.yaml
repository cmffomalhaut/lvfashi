---
无形学院:
  定位: 超能力者非正式网络
  性质: 松散互助网络 | 无法通过学习获得能力
  起源: 超能力为诅咒刺激大脑产生的随机异能
  觉醒: 通常在青春期突然发生(不可预测)
  规模: 估计100~200人(登记+未登记)

  能力分类:
    念动力系: 物体操控/飞行/力场(最常见)
    精神感应系: 读心/意念通信/记忆读取
    预知系: 未来视/危机感知/概率推算
    身体强化系: 超速度/怪力/再生
    元素操控系: 电/火/水/重力(稀有)
    特殊系: 时间操作/空间操作/概率操作(极稀有)

  等级:
    F级: 微小能力(点烟/折汤匙)
    E级: 日常可用的方便能力
    D级: 战斗级
    C级: 精英战斗员级
    B级: 城市级威胁
    A级: 国家级威胁
    灾厄级(S级): 战略级·极少数存在

  特性:
    能力觉醒随机且不可控
    无统一训练体系(自行摸索)
    使用过度→诅咒侵蚀加速
    难以被魔法/咒术封印
    不受传统结界约束

  关键人物:
    "サイレント": 网络管理员·身份不明
    神崎架音: 念动力者·星月大学学生

  据点:
    网络匿名论坛(主联络方式)
    各区秘密咖啡馆(线下见面点)
    樱台学园都市(年轻能力者聚集)

  关系:
    紧张: 特管课(登记vs反登记·部分已登记)
    被狩猎: 邪恶结社(捕获实验对象)
    中立: 魔法少女 | 阴阳师
    被雇佣: 中立企业(安保/研究)
    部分参赛: 地下武斗会

  当前动向:
    - 发现有人在暗中猎捕超能力者进行实验
    - 正在追查幕后黑手
    - 部分成员已失踪(怀疑与邪恶结社有关)
