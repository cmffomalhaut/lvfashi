---
欲乐天:
  称号: 蜜身之主 | 甘美陷阱 | 永不停歇的宴席
  定位: 色欲/享乐/堕落领域的邪神
  状态: 已确认存在 | 未被完全封印 | 处于低频活跃态
  本质: 以欲望为食的存在
          并非直接杀戮型邪神→它"给予人们想要的·然后取走人们不愿给的"
          它的力量在欲望越强的时代越活跃
  形态: 无固定形态
          在每个人面前呈现为"最能引发其欲望"的形象
          被目击的报告从无到有·因为目击者无法移开视线·事后无法清晰描述
  
  传说与历史:
    古称: 在天竺神话中对应"魔罗"的一面的变体
          在日本被部分密教文献记载为"欲天"的暗面
          在欧洲炼金术手稿中以"绯红女郎"的形象出现
    封印记录:
      第一次: 平安时代末期·阴阳师联合高野山僧兵将其封印于东国某处山中
      第二次: 江户中期·封印松动·吉原游廓爆发"倾倒病"→被重新封印
      第三次: 1945年大讨伐战中·噬渊之主降临引发连锁反应→欲乐天的封印再次受损
              但当时所有战力都在对付噬渊之主→仅做了临时加固
    现状: 封印仍未完全恢复→它可以通过梦境和强烈欲望"滴漏"
  
  能力与影响:
    被动领域: 在其影响范围内·人的欲望会逐渐放大
              先是食欲·物欲→然后转向色欲·支配欲·破坏欲
    主动能力: 编织甜美梦境·制造幻觉·精神魅惑
              它从不强迫→它让受害者"自己选择堕落"
    诅咒印记: 被深度影响的人身上会出现不易察觉的"蜜色纹样"
              像皮肤下隐约透出的金色血管→只有能力者或特殊方法才能看见
  
  在星月市的活动:
    当前活跃度: 低·但稳定
    感染渠道: 夜店·地下酒吧·暗网交友·高级风俗店
    受影响者特征: 逐渐沉溺享乐→越来越不在乎其他事
                  最后会"自愿"参加邪教的仪式→成为"蜜身的器"
    特管课认知: 已确认欲乐天的"滴漏"存在
                但将其归类为"低优先级的慢性威胁"
                因为它的影响速度很慢·且受害者往往"看起来只是变堕落了"
    实际危险: 它的危险性不在于爆发力
              而在于它悄无声息地腐蚀社会的基础——人与人的信任和羁绊
  
  与其他邪神的对比:
    噬渊之主: 力量型·直接毁灭 | 欲乐天: 渗透型·缓慢腐蚀
    梦魇之母: 梦境边界·中性 | 欲乐天: 欲望领域·堕落
    锈蚀之喉: 物质腐朽·自然 | 欲乐天: 精神腐朽·诱惑
  关系: 欲乐天与其他邪神无直接交集
        它的领域(欲望)是独立的·不与其他邪神冲突也不合作
        note: 欲乐天甚至可能不知道其他邪神的存在——它只关心"宴席"
  
  特管课评价: "理论上应该优先处理。但实际上——它在腐蚀社会之前，先腐蚀的都是边缘人。所以优先级一直被压后。"
  魔法少女直觉: "那个东西……让我觉得比打架更可怕。因为它让人不想打它。"
