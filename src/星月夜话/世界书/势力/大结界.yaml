---
大结界(星月市隐匿结界):
  定位: 覆盖全城的巨大隐匿结界
  起源: 1945年大讨伐战后·利用古代结界遗迹构建
  本质: 利用封印网络改造的广域术式
  维护: 阴阳寮主力+巫女辅助
  核心节点: 六大行政区各设一个(共6个)
  能源: 城市地脉灵力+封印孔溢出能量

  核心功能:
    隐匿: 隐藏超自然存在(普通人看不到/感知不到)
    抑制: 抑制诅咒扩散范围
    封印辅助: 协助封印孔的稳定
    监测: 灵力波动异常检测
    警报: 当结界出现异常时通知阴阳寮

  六大节点:
    中央区·星月塔(主节点·最稳定)
    东月区·御蔭神社(历史最久)
    西海区·灯塔(受工业影响·波动大)
    南星区·特管课地下(受科技设备干扰)
    北郊·封印孔上方(最不稳定·受秘境影响)
    樱台学园都市·星月大学钟楼(最年轻节点)

  当前状态:
    检测到未知弱化迹象
    原因: 调查中(怀疑与封印老化/诅咒浓度上升/人为破坏有关)
    警戒: 阴阳寮已提升维护频率
    备用方案: 紧急情况下可启动后备结界(功率减半)

  危机场景:
    部分弱化: 出现"灵异目击"事件增多
    大面积弱化: 超自然存在部分暴露
    崩溃: 超自然存在全面暴露→表社会恐慌→里社会秩序瓦解
    紧急修复: 需要大量灵力 supply→召集所有可用能力者

  关联条目: 阴阳师 | 星月地理 | 封印孔
