---
武藏会:
  定位: 古老武家势力联合 | 古流武术联盟
  性质: 武道修行组织 | 不主动参与里社会争斗
  理念: "武道即是修行" | 以武守护秩序
  据点: 东月区·武藏会馆(本部) | 各流派道场
  历史: 战国时代延续 | 战后吸收新兴流派

  能力体系(气):
    气的基础: 呼吸法/冥想/锻体
    剑术: 一刀流/二刀流/居合/小太刀
    柔术: 投技/固技/关节技/当身技
    枪术: 十文字枪/薙刀
    弓术: 和弓/流镝马
    气力应用: 武器附魔(气刃)/身体强化/感知杀意

  境界等级:
    入門→見習→初段→中段→上段→师范代→师范→剑圣
    高段位可做到:
      - 空手断铁
      - 踏水而行
      - 感知杀意(危险预知)
      - 气刃(远程斩击)
      - 短时间内肉体极限突破

  主要流派:
    柳生新陰流(剑术) | 天道流(综合)
    起倒流(柔术) | 宝藏院流(枪术)
    小笠原流(弓术) | 天然理心流(剑术)

  关键人物:
    柳生十兵卫: 剑术师范代
    鬼头一馬: 柔术·最强格斗者

  表身份:
    各流派经营剑道馆/空手道馆/居合道场
    接受普通市民报名(从中选拔有天赋者)
    部分成员在警视厅担任武术指导

  关系:
    合作: 特管课 | 魔法少女(尊重)
    竞争: 忍者里(历史渊源·武士vs忍者)
    友好: 诸夏天师(以武会友)
    敌对: 邪恶结社
    表面反对: 地下武斗会(视为弟子实战试炼场)

  当前动向:
    - 注意到星月市气脉流动异常
    - 各道场加强警戒
    - 不定期派人暗中观察地下武斗会
