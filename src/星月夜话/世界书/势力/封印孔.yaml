---
封印孔:
  定位: 星月市地下最深处的邪神封印点
  位置: 北郊地下约2km处
  性质: 与深渊相连的次元裂缝(人工封印状态)
  起源: 1945年大讨伐战终局·封印噬渊之主残骸
  看守: 阴阳寮(术式维护)+特管课(物理警戒)
  状态: 稳定(但有周期性波动)

  结构:
    第一层: 物理封锁(特制合金闸门·多重锁)
    第二层: 阴阳术封印(五行结界·八卦阵)
    第三层: 各国联合封印(多重复合术式)
    核心: 邪神残骸镇压点(封印最深处)
    渗漏: 诅咒粒子持续从缝隙渗出(不可完全阻止)

  波动周期:
    每日小波动: 诅咒浓度±2%
    每月大波动: 月圆之夜浓度峰值+5~10%
    每年异常: 大净解之仪前后(仪式压制vs反弹)
    每十年: 可能出现封印弱化(最近一次: 2024年)

  警戒等级:
    绿: 正常(浓度40以下)
    黄: 注意(浓度40~60·近期状态)
    橙: 警戒(浓度60~80·可能触发诅咒爆发)
    红: 危机(浓度80以上·需要紧急封印加固)
    黑: 崩溃(封印失效·需要全体动员)

  关联危险:
    诅咒爆发: 浓度过高时→影响范围扩大到地表
    深渊化: 长期接近→生物异变
    碎片共鸣: 当多个邪神碎片靠近时→封印压力↑
    人为破坏: 邪恶结社/邪神崇拜者可能尝试

  关联条目: 邪神 | 阴阳师 | 大结界 | 星月历史年表
