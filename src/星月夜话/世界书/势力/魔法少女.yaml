---
魔法少女:
  定位: 与契约之源缔结契约的少女们 | 个体行动·隐性结盟
  性质: 自发维护城市和平的松散网络
  核心: 契约之源授予变身能力与魔法武装
  力量本质: 契约之力 | 魔力 | 变身状态增幅
  人数: 约30~50人(星月市内活跃)
  性别: 全女性(契约之源只选择少女)
  阶级: 见习→青铜→白银→黄金→水晶→传说(隐性排序·非正式)
  日常伪装: 大多数有表身份(学生/上班族)
  变身限制:
    - 变身状态能力远超常态
    - 魔力消耗过度→自动解除→生命危险
    - 魔力恢复需休息/吸收环境灵力
  魔法武装: 契约之源根据缔结者内心给予
    - 武器型(剑/弓/杖/铳)
    - 装甲型(强化服/屏障)
    - 召唤型(使魔/精灵)
  核心原则:
    守护原则: 保护普通人免受超自然威胁
    隐藏原则: 变身时不得被普通人目击
    不干涉原则: 不主动介入其他势力争斗
  rank参考:
    青铜级: 单体妖魔程度 | 维持治安
    白银级: 小队作战 | 秘境探索
    黄金级: 城市级威胁对应 | 稀有
    水晶级: 区域级战力 | 极少数
    传说级: 战略级 | 每隔数十年出现一人
  已知成员:
    神代美咲: 青铜~白银级 | 在校魔法少女
    (其他待剧情生成)
  关系:
    正义结社: 合作(特管课/阴阳师)
    敌对: 邪恶结社 | 妖怪 | 邪神崇拜者
    中立: 魔女结社(时敌对) | 超能力者
    支援: 月影之友会(情报/医疗)
  当前动向:
    - 近期秘境活跃导致魔力波动异常
    - 多名魔法少女感知到不祥的预兆
    - 部分成员报告遭遇不明身份的能力者追踪
