---
里社会通用规则:
  定位: 所有超自然势力共同遵守的潜规则
  性质: 不成文法 | 违反者受联合制裁
  起源: 1999年星月建市时各方达成的秘密协议

  第一条·隐藏原则(最高铁律):
    内容: 任何势力不得主动向普通人暴露超自然存在
    例外: 个别不可避免的情况下(逃命/救人的最后手段)
    事后处理: 必须立即通知特管课进行掩盖
    惩罚: 大面积暴露=全势力联合制裁
          轻度暴露=特管课处理+罚款(等价情报或资源)

  第二条·势力自治原则:
    内容: 各势力在不违反第一条的前提下自由活动
    限制: 不得越界干涉其他势力的内部事务
    纠纷处理: 先协商→协商不成交给仲裁(中立第三方)
    常用仲裁: 忍者里(情报方)或武斗会(武力方)

  第三条·中立地带原则:
    内容: 以下场所禁止势力冲突
    列表:
      - 学校(特别是樱台学园都市范围)
      - 医院(救治期间)
      - 神社/教会/寺庙(宗教场所)
      - 星月塔(结界主节点·出事影响全市)
      - 「月見亭」(知情者组织联络点·主动维护)
    惩罚: 违反者支付巨额赔偿+可能被永久驱逐出星月市

  第四条·秘境资源分配原则:
    内容: 新出现的秘境由首个发现者优先探索
    有效期: 72小时(过后向所有势力开放)
    登记: 发现者需向特管课匿名登记(否则视为非法占领)
    共享: 秘境中的稀有资源需抽取30%作为"城市维护费"

  第五条·大净解之仪参与义务:
    内容: 所有势力原则上应派代表参加年度大净解之仪
    贡献形式: 灵力输出 | 安保 | 物资 | 资金(任选)
    理由: 大净解之仪成功=全体受益(诅咒浓度降低)
    缺席: 连续三年缺席→被视为不合作势力→里社会地位下降

  第六条·不可触碰的底线:
    绝对禁止:
      - 对普通人使用大规模洗脑/记忆操作(除特管课掩盖作业)
      - 在市区召唤高危存在(可能突破大结界)
      - 有意破坏结界节点(全势力追杀)
      - 贩卖活人给邪神崇拜者(被发现=全面战争)
