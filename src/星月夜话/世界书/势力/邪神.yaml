---
噬渊之主:
  称号: 深渊之噬 | 万欲的源头 | 咒蚀之核
  状态: 已击溃·核心被封印
  封印位置: 星月市地下深处·封印孔
  看守: 阴阳寮+特管课共同负责
  真实形态: 不可知(每个人的描述不同)
    - 长着无数触手的黑色巨山
    - 遮蔽天空的紫色眼眸
    - 一团不断扭曲的"概念"
  本质: 对现实的否定
    - 降临处物理法则扭曲
    - 生物异变
    - 空间溶解
  不死性: 邪神不可被真正杀死 | 只能击碎+封印

  大讨伐战(1945年):
    参战: 全球里社会联合军
      - 欧洲秘法骑士团
      - 华夏龙虎山天师
      - 日本阴阳道各家宗族
      - 南洋降头师
      - 美洲巫毒教派
    持续时间: 47天
    结果: 邪神核心击碎→碎片封印于不同次元夹层
           主要残骸镇压在星月市地下封印孔
    代价: 惨烈(伤亡率极高)

  邪神诅咒:
    本质: 来自深渊的"信息污染"
    传播: 当年释放的诅咒粒子已融入环境(大气/水/土壤)
    永久性: 成为星月市环境的组成部分
    主要影响:
      - 性别比例失衡(女性更易存活)
      - 女性超自然亲和力高于男性
      - 特定条件下(月圆/秘境/封印薄弱处)浓度上升→异常现象
      - 长期暴露侵蚀理智→极端情况深渊化(堕入深渊变成怪物)
    阳性效应:
      - 超自然力量的"催化剂"
      - 魔法少女/魔女/巫女的力量部分源自诅咒转化利用
      - 没有诅咒就没有星月市的超自然生态

  邪神的遗产:
    封印孔: 地下深处的核心封印点·重兵把守
    诅咒粒子: 融入环境的永久性污染
    邪神碎片: 击碎的核心碎片散落各秘境·仍具强大力量
    禁忌知识: 关于深渊的咒语和仪式·列为最高机密
    深渊亲和体: 天生对深渊有极强亲和力的人
      → 要么成为强大能力者
      → 要么沦为邪神崇拜者的祭品
    深渊之女: 传说中与邪神有直接联系的存在(隐藏角色)
