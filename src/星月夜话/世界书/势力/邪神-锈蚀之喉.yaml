---
锈蚀之喉:
  称号: 万物归锈者 | 腐朽低语 | 千年之蚀
  状态: 部分活跃 | 未被封印(因其性质无需封印)
  定位: 并非传统的"邪神"而是"自然法则的极端面"
          代表熵增·腐朽·时间对万物的消磨
  本质: 不是被召唤的存在=它是"过程"本身
          如同重力无法被封印→腐朽也无法被阻止
          每一个生锈的钉子·剥落的墙皮·褪色的照片→都是它的"低语"
  
  存在形式(推测):
    无实体·无意识·无处不在
    表现为"加速的熵增"
    在诅咒浓度高的区域→它的"声音"可以被感知为金属摩擦声
    某些禁术试图利用它的力量→加速敌人装备/肉体的腐朽
  
  神秘学定位:
    古炼金术中的"盐之原则"(腐化与固化的一体两面)
    日本民间传说中"錆神"(锈神)的原型
    欧洲神秘学中的"锈蚀天使"(未被允许进入天堂的存在)
    三大古老势力(阴阳师·教会·天师)的古籍均独立记载过类似存在
  
  与噬渊之主的关系:
    不同性质: 噬渊之主是"外来的深渊入侵者"
    锈蚀之喉是"世界本身的固有属性"
    两者无恩怨·各自存在于不同的"层面"
    推测: 噬渊之主降临时锈蚀之喉的反应是"加速了星月市的腐朽进程"
  
  对人类的影响:
    正面: 腐朽=新陈代谢·旧事物消亡为新事物腾出空间
    负面: 加速衰老·装备劣化·建筑倒塌·记忆模糊
    能力者影响:
      - 长期接触高浓度诅咒的能力者会更快衰老
      - 但部分咒术师会利用锈蚀之力施放"腐朽咒"
      - 利用者最终会付出代价(身体加速腐朽)
  
  相关现象:
    锈蚀弧: 忽然大面积生锈的现象·原因不明
      特管课记录: 年均3~5起·多发生在封印薄弱处
    记忆褪色: 少数人抱怨记忆像"被什么啃过"一样模糊
      科学研究: 定性为压力导致的海马体功能退化
      里社会猜测: 可能与锈蚀之喉的被动影响有关
    旧物的"低语": 古玩商/旧书商会说"有些东西带着'记忆的回声'"
      可能原因: 物品因长时间存在而携带了"锈蚀的痕迹"
  
  势力接触记录:
    无任何势力主动接触锈蚀之喉(无法接触)
    邪恶结社曾试图研究"利用锈蚀之力加速敌人装备腐朽"→实验失败·3名研究员身体出现不可逆的"锈化"
    魔法师协会的炼金部门: 将锈蚀之喉的效应纳入"物质衰变研究"
    一般认知: 大多数能力者认为锈蚀之喉与其说是"神"不如说是"自然现象"
