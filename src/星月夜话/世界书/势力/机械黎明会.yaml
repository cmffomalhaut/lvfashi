---
机械黎明会(Mechanical Dawn):
  定位: 新兴秘密结社 | 科技至上主义 | 深藏于企业/大学/研究所
  别称: "齿轮""金属教团"
  目标: 以科技超越超自然 | 消除人类对魔力的依赖
  核心理念:
    - 魔力/诅咒/灵力=旧时代的落后能源
    - 科技(机械/电子/生物工程)=人类的真正进化方向
    - 里社会的存在证明人类走错了路→要用科技纠正
  信条: "血会流尽·咒会消散·唯齿轮永转"
  
  历史:
    形成: 约15年前·由一批科学界/工程界人士秘密发起
    契机: 创始人们在目睹里社会冲突后认定"超自然力量只会带来混乱"
    演化: 从学术讨论会→秘密结社→拥有武装研发能力的地下组织
    现状: 已渗透数家科技企业与大学研究室
  
  组织架构(扁平):
    顾问团: 3名发起人·身份完全保密(推测为学术界泰斗)
    支部制: 各城市设有独立行动支部·互不交叉
    研究团队: 按项目分组·集中在几个秘密实验室
    行动人员: "清理者"·处理暴露风险和技术窃取
  成员背景: 科学家·工程师·医生·军人·被超自然伤害过的人
  
  技术成就:
    魔导干扰器: 可暂时压制小范围魔力·使咒术/魔法失效
    义体改造: 机械义肢可达到甚至超越魔力强化效果
    反咒涂层: 涂抹后防护低级诅咒/劣化魔力攻击
    监测网络: 在全城布设传感器→追踪异常魔力波动
    抗咒药剂(试作): 暂时提升对诅咒的抗性(非深渊精华系)
  
  与现有势力的关系:
    敌对: 邪恶结社(星之黄昏会)[理念冲突·技术竞争]
    警惕: 所有超自然能力者(视为"走错路的人")
    暗中合作: 特管课[偶尔共享反派结社情报]
    买卖: 暗网黑市[出售技术产品换取资金]
    利用: 地下武斗会[测试新装备的实战场所]
    中立: 大部分其他势力(尚未暴露)
  特管课评估: "潜在威胁·目前未发现违法活动·持续监控"
  
  当前动向:
    - 研发可完全屏蔽诅咒感知的"静默立场"
    - 追踪邪恶结社的科技→防止咒术科技扩散
    - 秘密招募各大学工科/理科的优秀学生
    - 准备公开一项"足以改变里社会格局"的技术突破(内容不明)
