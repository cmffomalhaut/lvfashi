---
蜜身会:
  定位: 崇拜欲乐天的秘密邪教 | 以"肉身布施"为核心仪式的享乐主义集团
  规模: 推测约50~80名核心成员 + 数百名"宾客"(被逐步引诱的普通人)
  教义核心: "肉身即供奉·欢愉即祈祷·沉溺即升华"
  隐藏: 不公开布道·不设固定据点·以高级俱乐部/会员制沙龙为掩护
  
  教义体系:
    蜜身三谛:
      一: "世间一切苦皆因压抑欲望而生"
      二: "解放欲望即是通向更高存在的道路"
      三: "终极解脱在于将自身化为'蜜身的器'——完全为欲乐天所用的容器"
    解读: 表面上是享乐主义哲学
          深层是逐步引导信徒放弃自我意志→最终成为欲乐天力量的通道
    仪式:
      日常: "蜜身礼"——每日以享乐行为(美食/美酒/性/其他感官刺激)作为祈祷
      周常: "共宴"——信徒聚集·在欲乐天影响下集体沉溺
      月常: "蜜身奉仕"——核心仪式
             新入者以"肉身布施"形式(将自己的身体感官体验作为祭品)
             奉献给欲乐天和资深信徒
             自愿原则(表面上)·但持续不参与会被暗示"你的心还不够开放"
      年常: "甘露祭"——选出一名"蜜器"(最深入沉溺的信徒)
             举行特殊仪式使其成为欲乐天的永久通道
             此人之后将失去自我意识·成为活着的"蜜身器"
  
  招募方式:
    不主动招募·通过"气味相投"的自然吸引
    目标人群: 
      - 生活空虚的有钱人(寻求刺激)
      - 情感创伤者(寻求慰藉)
      - 权力欲强的人(寻求控制感)
      - 艺术创作者(寻求灵感)
    场所: 高档酒吧·私人画廊·身心疗法工作室·品味俱乐部
    步骤:
      第1步: 被邀请参加"品味聚会"(高端社交)
      第2步: 体验"欲望解放工作坊"(开始接触理念)
      第3步: 参加"共宴"(第一次集体仪式)
      第4步: 受邀正式加入蜜身会(此时已很难脱离)
  
  组织架构(松散但有效):
    "执宴者": 会长级别·推测3~5人·掌握蜜身会的真正目标和欲乐天的沟通方式
    "司蜜者": 中层·主持日常仪式·招募新人·管理各沙龙据点
    "蜜身者": 普通核心信徒·定期参加共宴和奉仕
    "宾客": 尚未正式加入·但已经在被逐步引诱的人
    "蜜器": 完成甘露祭的活祭品·已失去自我·永久作为欲乐天的通道
  掩盖: 对外的说法是一个"高端身心探索社群"
  
  据点:
    无固定总部·但在以下地方有定期活动:
      - 中央区某栋会员制高级公寓顶层(共宴场地)
      - 西海区一座改造仓库(蜜身奉仕仪式场地·伪装成地下艺术空间)
      - 星月市外·山中的一处旧别墅(甘露祭场地·仅核心成员知道)
    秘密联络: 通过加密聊天应用"蜜语"进行
    
  资金来源: 会员费(极其高昂)·信徒捐赠·部分信徒本身就是有钱人
  
  与现有势力的关系:
    特管课: 已注意到存在·但难以取证(所有仪式表面自愿·无暴力痕迹)
            目前仅列为"需关注的新兴疑似邪教组织"
    邪恶结社(星之黄昏会): 彼此知道对方存在·暂无交集
                          邪恶结社认为蜜身会"太低级·像暴发户的玩具"
                          蜜身会认为邪恶结社"太严肃·不懂享受"
    其他势力: 几乎不知道蜜身会的存在(隐藏极好)
    暗网黑市: 蜜身会偶尔采购特殊药物/道具
  
  特管课备注: "即便突袭现场也顶多控一个'妨害风化'。除非有人愿意作证自己被强制——但目前没有一个前成员愿意开口。"
  
  当前动向:
    - 正在筹备下一次"甘露祭"·蜜器候选者已锁定2人
    - 试图向更上层的社交圈渗透(政治人物·企业高层)
    - 部分成员开始出现欲乐天的诅咒印记(蜜色纹样)
    - 有一名前成员逃离·目前处于特管课保护下·但拒绝作证
