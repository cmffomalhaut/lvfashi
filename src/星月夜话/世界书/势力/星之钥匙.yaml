---
星之钥匙:
  定位: 当前势力争夺的核心物品
  数量: 七件
  本质: 古代封印的核心碎片·经过特殊加工
  外观: 结晶质地的钥匙形状(各件颜色/大小不同)
  起源: 与1945年封印仪式有关(可能是封印阵的组件)

  已知信息:
    功能: 集齐七件→可打开某处巨大秘境
    秘境性质: 不明(推测与深渊或邪神碎片有关)
    散落: 各势力持有或各秘境深处
    状态: 大多数未找到或未确认持有者
    传说: 七件合一可"改变星月市的命运"

  各件下落(已知部分):
    #1: 邪恶结社持有(来源: 北郊秘境发掘)
    #2~#4: 下落不明
    #5: 传言被月蚀拍卖行经手(已匿名售出)
    #6: 阴阳寮保管中(世代传承的"封印之证")
    #7: 与星月塔的结界核心共鸣(推测在塔内)

  各势力动向:
    邪恶结社: 积极收集(已确认拥有至少1件)
    忍者里: 收集各势力情报→准备拍卖
    特管课: 追查下落→防止落入结社之手
    魔法少女: 受直觉驱使→自发保护与钥匙相关事物
    阴阳寮: 守护已有钥匙+追查其余下落
    月蚀拍卖行: 曾经手至少一件(买家身份不明)

  关联条目: 邪恶结社 | 大结界 | 阴阳师 | 势力关系总览
