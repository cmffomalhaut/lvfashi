---
深网市场(通称·暗网黑市):
  定位: 线上超自然物品交易平台
  性质: 完全匿名 | 端到端加密 | 无法追踪
  访问: 特定软件+入口地址(地址定期更换)
  服务器: 分布在多个国家和秘境中(无法查封)
  货币: 加密货币 | 等价情报
  维护: 「深网行者」团队(数名神秘管理员)
  成立: 约15年前

  商品分区:
    武器区: 咒术武器/附魔装备/对超自然子弹
    魔药区: 治疗药/媚药/变身药水/记忆结晶
    情报区: 各方秘密/封印孔状态/势力动向
    契约区: 空白契约书(咒术约束力)/魔物娘契约套装
    诅咒物区: 邪神碎片加工品/被污染的魔法武器
    特殊服务区:
      - 诅咒代行者(出钱让高手代为诅咒)
      - 替身服务(短期替代某身份)
      - 能力租赁(临时获得特定能力)
      - 记忆编辑(记录/删除/修改记忆·价格极高)

  交易规则:
    买家卖家全部匿名
    有评价系统和担保机制
    高信誉卖家享有"深网认证"标识
    交易纠纷由深网行者仲裁(仲裁结果强制执行)
    禁止直接联络线下交易(违者封号)

  热门商品(排行榜):
    催淫香/媚药(诅咒植物提取·常青树)
    变身药水(改外貌·潜入/其他用途)
    记忆水晶(记录/删除记忆·超高价格)
    契约之书(签字即具咒术效力)
    诅咒护符(抵挡一次诅咒·携带者受微量侵蚀)
    魔物娘契约套装(与魔物签订主从契约)

  关系:
    合作: 忍者里(部分情报流通) | 月蚀拍卖行(线上预览)
    常客: 邪恶结社(购买违禁咒物)
    猫鼠: 特管课(常年试图查封·收效甚微)
    使用: 几乎所有势力(偶尔)

  关键人物:
    「深网行者0号」: 创始人·真实身份无人知晓
