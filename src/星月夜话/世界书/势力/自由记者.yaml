---
自由记者(里社会报道者):
  定位: 记录和报道里社会事件的独立个人·无组织
  别称: "书写者""暗街记者"
  性质: 不是统一组织·而是彼此松散认识的个人
  数量: 星月市约10~15人(活跃)
  信条: "记录·但不介入"
  
  工作内容:
    记录里社会事件(冲突·秘境爆发·势力动向)
    撰写并在地下渠道发布"里社会日报"(不定期)
    为部分势力提供付费情报(但不做间谍)
    为无声者发声(偶尔报道被大势力欺压的小人物)
  发布渠道: 暗网·加密电报·漂流邮便局代送·部分通过街角食堂
  权力: 不携带武器·不参与战斗·凭"记录者"身份获得各方有限度容忍
  
  自律规则:
    - 不介入事件·只记录
    - 保护信息来源·绝不出卖线人
    - 不歪曲事实·不煽动对立
    - 不报道: 无关的普通人身份·纯粹个人隐私·可能引发大规模恐慌的信息
  制裁: 违反规则的记者会被同行走的"记者圈"除名→失去信息源→无法工作
  
  知名记者:
    "快门"(あざみ):
      特征: 女性·20多岁·总是挂着相机的自由摄影师
      专长: 拍摄"绝对不可能拍到的"现场照片
      风格: 从不写文字·只用照片做报道
      note: 她拍的"某次秘境内的东西"照片被各方高价收购·但她从不卖
    
    "鸦"(カラス):
      特征: 男性·年龄不详·以匿名专栏"鸦之眼"闻名
      专长: 深度调查·挖各方黑料·追踪长期趋势
      风格: 犀利·不留情面·但"只写事实·不写推测"
      note: 他写的"星之钥匙系列报道"是目前关于钥匙最全面的公开情报
            "鸦"从未暴露过真面目·连性别都是推测
    
    "文吉"(ぶんきち):
      特征: 老年男性·自称"退休的杂志记者"
      专长: 人情故事·小人物视角
      风格: 温暖·带一点老派文人的感伤
      note: 他写的"街角食堂的咖喱与停战协议"是里社会公认的经典报道之一
  
  关系:
    全体: 容忍·利用·戒备
    特管课: 官方立场"不承认也不否认"·私下某些记者有特管课的线人
    漂流邮便局: 合作(邮局帮他们递送报道)
    各大势力: 知道有些记者存在·但大多选择无视(报道太离谱也没人信)
    街角食堂: 记者们的聚集地·"鸦"的黑板专栏贴在食堂墙上
  
  风险:
    最近有一名新记者试图深入邪恶结社的设施采访→失踪至今
    部分势力开始用"合成照片"和"虚假报道"来混淆视听→记者圈信任危机
    暗网上出现了"记者悬赏"→某些人不喜欢被记录
