---
星月魔法师协会:
  定位: 西洋魔法学术组织
  据点: 樱台学园都市·星月大学旧校舍地下
  性质: 学院派 | 研究型 | 开放
  理念: "魔法学即是科学"
  起源: 留学归来的魔法使+本土研究者

  能力体系:
    元素魔法: 火/水/风/土(四大基础系)
    召唤术: 精灵召唤/异界存在召唤(契约制)
    炼金术: 物质转化/魔药炼制/道具强化
    符文术: 北欧符文/所罗门小钥匙(封印/祝福)
    结界: 西洋式魔法结界

  等级制度:
    学徒→正使→导师→贤者→大贤者
    升级条件: 学术成果+实战考核+协会贡献

  关键人物:
    シャーロット・E・ウィンザー: 协会长·召唤术专精
    如月银河: 炼金术导师

  设施:
    星月大学地下研究室(主设施)
    炼金工坊(材料加工/道具制作)
    图书馆(西洋魔法藏书)
    召唤之间(召唤术专用结界室)
    元素塔(四大元素调和装置)

  日常业务:
    - 学术研究/魔法理论体系化
    - 炼金物品制作/贩卖
    - 秘境调查报告(卖给特管课)
    - 魔法教育(指导学徒)

  关系:
    合作: 特管课 | 中立企业(炼金供应)
    紧张: 魔女结社(学術vs血脉路线分歧)
    敌对: 邪恶结社
    兴趣: 异界人(学术研究·非敌意)
    中立: 教会(部分成员持批判态度)

  当前动向:
    - 对新出现秘境进行初步调查
    - 发现其中存在未知的魔法构造
    - 正在分析秘境能量样本
