---
阴阳寮·星月分部:
  定位: 传统阴阳师组织 | 里社会最官方传统势力
  总部: 京都 | 星月为分部
  据点: 东月区·御蔭神社
  核心职责: 管理灵脉 | 维护大结界 | 监视封印孔
  历史: 1945年参与大讨伐战后常驻星月
  传承: 家族制度(御蔭家为主) | 外姓弟子可入门

  能力体系:
    式神使役: 动物灵/付丧神/神使/式神使徒
    结界术: 大结界维护/封魔结界/隐匿结界
    五行术法: 金木水火土五种基本术式
    占星术: 星象观测/吉凶预测/诅咒浓度预测
    咒术: 封印咒/净化咒/束缚咒/破魔咒

  等级制度:
    学徒→阴阳士→阴阳师→大阴阳师→阴阳博士
    各等级对应可操控的式神强度和数量

  关键人物:
    御蔭宗一郎: 寮长·大阴阳师
    御蔭绫乃: 巫女·宗一郎之女(跨组织)
    (其他待补充)

  关系:
    同盟: 巫女(共用御蔭神社)
    合作: 特管课(正式协议) | 魔法少女
    竞争: 诸夏天师(道法vs咒术)
    中立: 教会 | 魔法师协会
    敌对: 邪恶结社 | 妖怪 | 邪神崇拜者

  大结界:
    性质: 覆盖全城的巨大隐匿结界
    功能: 隐藏超自然存在/抑制诅咒扩散
    维护: 阴阳寮主力维护+巫女辅助
    状态: 检测到未知弱化迹象(原因调查中)
    危机: 若大结界崩溃→超自然存在全面暴露

  当前动向:
    - 大结界出现未知弱化
    - 灵脉波动异常调查中
    - 协助特管课追查星之钥匙
