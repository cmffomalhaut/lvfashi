---
深渊之子(邪神崇拜者):
  定位: 崇拜噬渊之主的秘密教团
  性质: 邪教组织 | 比邪恶结社更极端
  目标: 打开通往深渊的永久通道 | 迎接邪神降临
  理念: "净化"世界=毁灭现有文明 | 在深渊中重生
  规模: 约50~100名核心成员+外围信徒

  组织结构:
    大司祭: 身份完全不明·甚至不确定是否为人类
    "低语者": 中层干部·传播教义
    信徒: 分为三层(核心/正式/外围)
    细胞式: 各小组互不知晓 | 单线联系

  能力来源:
    深渊的禁忌知识(来自邪神碎片)
    邪神赐予的扭曲力量(活祭换取)
    仪式获得的短时间咒力增幅

  常用仪式:
    活祭: 获取邪神恩赐的核心手段
    血之契约: 以自身鲜血签订深渊协议
    碎片共鸣: 利用邪神碎片进行大型仪式
    深渊之门: 试图打开永久通道(最终目标)

  精神状态:
    普遍不稳定 | 狂热而危险 | 被深渊低语影响
    长期接触深渊知识→理智侵蚀→思维扭曲

  关系:
    互相利用: 邪恶结社(目的不同·结社想控制·他们想毁灭)
    死敌: 教会 | 魔女结社
    潜在敌: 所有秩序侧势力
    恐惧: 即使是邪恶结社也对他们的某些仪式感到不安

  当前动向:
    - 策划大规模仪式
    - 需要七个"纯净的灵魂"作为祭品
    - 正在绑架符合条件的年轻人
    - 大司祭身份调查中(特管课最高优先度)
