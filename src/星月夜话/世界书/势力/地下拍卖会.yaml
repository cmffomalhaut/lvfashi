---
月蚀拍卖行:
  定位: 最神秘的地下拍卖行
  性质: 完全邀请制 | 绝对中立
  主持: 「月蚀夫人」·永远以面纱示人的女性
  传言: 曾是某大势力的首领
  据点: 移动式·使用大型结界术制造临时空间

  邀请机制:
    邀请函: 印着月蚀图案的黑卡(烫金字体)
    上面写有: 时间+坐标(只在拍卖前72小时发出)
    获取条件: 必须有现有会员推荐 | 或拍卖行主动邀请
    入场: 必须佩戴拍卖行提供的"匿名面具"
      - 阻断灵力识别和窥探
      - 基础物理伪装
    包厢: VIP包厢供大势力代表 | 完全隔绝

  拍卖品分类(Lot编号系统):
    Lot-A(武器/道具): 秘境出产的魔法道具/古代咒物
    Lot-B(情报): 各大势力秘密/封印孔状态/男女比例数据
    Lot-C(活物): 异界人奴隶(法律灰色)/稀有魔物
    Lot-D(契约): 能力转让/服务契约
    Lot-E(特殊): 诅咒情报/邪神碎片

  常拍精品:
    诅咒道具(邪神碎片加工品/被污染魔法武器)
    秘境特产(镜之心碎片/世界树果实/遗迹科技)
    能力结晶(封印特定能力·转让他人使用一次)
    契约奴隶(极少·仅限自愿卖身契的异界人或债务者)

  支付方式:
    现金(日元/美元/欧元) | 加密货币
    等价情报(由拍卖行鉴定估值)
    服务契约(提供特定服务抵扣)
    能力转让(稀有)
    禁忌/稀有物品(以物易物)

  规则:
    入场必须佩戴匿名面具(全场佩戴)
    成交后卖家与买家永不见面
    禁止调查其他参与者身份(违者永久驱逐)
    拍卖行不对真伪和来源做担保(买者自负)
    拍卖场内动手→永久列入黑名单

  关系:
    合作: 暗网黑市(线上预览与支付) | 忍者里(情报支持)
    供货: 中立企业 | 各势力(匿名出售)
    客户: 所有势力
    拒绝: 已知的极端危险人物(极少数)
