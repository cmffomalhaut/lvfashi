---
特殊造物-淫纹:
  分类: 咒术刻印
  通称: 咒性刻印纹
  原理: 邪神核心天然纹路→深渊力量转化为特定指令→改良为可刻印人体的实用技术
  材料: 邪神碎片粉末调制特殊墨水
  工具: 咒具刻刀/特殊灵力针
  特性: 刻印后与灵魂绑定·毁肉身也会在转生/灵体上重现。无法常规消除
  已知种类:
    奴隷纹:
      外观: 锁链状花纹环绕脖颈·手腕或脚踝
      功能: 使宿主无法反抗持有钥匙者。命令时纹路收紧→全身麻痹+服从冲动
      副作用: 自尊心·自主性随佩戴时间永久削弱
    快楽纹:
      外观: 蝴蝶/花卉形状·常见于小腹·胸口或大腿内侧
      功能: 改写神经→魔力流通和身体接触→强化快感信号。战斗受击部分伤害也转化为快感
      副作用: 长期使用→正常性刺激耐受性下降→最终完全无法无刻印激活达到高潮
    魔力汲取纹:
      外观: 旋涡/齿轮状·后颈/肩胛骨之间
      功能: 身体转化为魔力提取终端→自动吸入周围灵力→过滤后传输到蓄魔装置
      副作用: 持续消耗体力→长期营养不良/魔力枯竭
    契約紋:
      外观: 文字环绕心形/圆形·左胸(心脏上方)
      功能: 双向契约·两人各刻一半。感知位置/状态·共享感官/传递魔力
      副作用: 诅咒相互影响·一方死亡则留下不可治愈"契约伤痕"
    深淵紋(最高机密):
      外观: 活物般变化几何图案·邪神核心纹路复制品
      功能: 宿主身体成为"深渊窗口"。刻印者可观察现世·灌输深渊知识/力量
      副作用: 自我意识逐渐被深渊同化→最终灵魂被吞噬→成为深渊行者容器
  社会影响: S级违禁技术。黑市地下流通美容型简易刻印·完整版仅结社和少数堕落咒术师掌握
