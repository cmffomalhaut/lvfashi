      应对: 特管课行动队配备精神防护头盔可阻断
    心灵劫持终端(最高机密):
      外观: 笔记本大小+头戴感应器+数据手套
      效果: 直接黑入目标意识·完全控制身体(目标变成"自己身体的观众")
