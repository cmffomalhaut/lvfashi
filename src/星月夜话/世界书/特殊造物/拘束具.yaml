---
特殊造物-咒式拘束具:
  分类: 咒具
  系列: 邪恶结社+暗网黑市流通的多款咒术拘束器具
  共通特性: 刻入咒文·束缚肉体的同时压制魔力/感官强化/精神操控
  已知种类:
    咒式手铐·魔力封:
      外观: 刻满细小咒文的黑铁手铐·内侧紫色绒布
      效果: 佩戴者魔力压制近乎零·持续释放诅咒波动削弱反抗意志
      使用: 结社标准配备·捕获目标后第一时间铐上。黑市有情侣版(效果减半+快感共鸣)
    灵力项圈·服从之证:
      外观: 黑色皮质项圈·内侧细小符文·正面银色小环
      效果: 佩戴者无法对钥匙持有者说谎或攻击。记录位置。高级版有电击/诅咒脉冲惩罚功能
      社会: 暗网最畅销淫具之一。部分人自愿购买以"获得精神放松"(项圈族亚文化)
    蛛丝拘束带:
      外观: 半透明银白色丝带·触感丝绸柔滑
      材质: 络新妇妖丝加工·轻若无物但极为坚韧(仅咒火可毁)
      特性: 对体温反应→体温越高收得越紧(越兴奋·越紧张·越想挣脱→越紧)
      特殊: 沾染体液后暂时软化→"让对方放松"比暴力挣脱更有效
    结晶檯·炉芯之座:
      外观: 紫色水晶+黑铁椅子·椅面咒文阵·靠背银发触针
      功能: 情欲发电机组件·固定素体+通过触针连接脊柱植入端子。座面倾斜·扶手有魔力汲取端子·座垫隐藏震动装置
      设计理念: "效率最高的素体是舒服的素体"
