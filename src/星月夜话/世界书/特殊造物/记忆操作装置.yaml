---
特殊造物-记忆操作装置:
  分类: 精神科技
  通称: 忘却之机械
  来源: 邪恶结社+异界人科技合作。结合异界精神波科技+深渊"灵魂锚定"特性
  能力: 读取·改写·删除·植入记忆。可触及灵魂层面深层记忆痕迹。1h内完成完整记忆重构
  硬件组成:
    精神波读取头盔: 银白半封闭·数百纳米感应针刺入头皮→操作者实时看佩戴者记忆画面
    记忆投影显示屏: 落地式·播放记忆画面·操作者标记需修改片段(可显示"理想自我"形象)
    记忆注入枪: 枪形装置·蓝色精神波束·射程50m·可远距离写入记忆
  操作类型:
    表层忘却(低风险):
      效果: 删除24h~1月短期记忆·不影响人格和长期记忆
      缺点: 记忆空白期可能被细心者察觉
    深层改写(中风险):
      效果: 修改长期记忆和人格基础。植入虚假记忆·改变对特定人物的感情
      风险: 与潜意识冲突→人格分裂/记忆混乱(有案例产生6重人格)
    人格植入(极高风险·成功率<30%):
      效果: 完整人格意识覆盖原有意识→灵魂夺舍
      失败: 白纸化·精神分裂·永久植物人
      应用: 素体完美人格化→植入"享受被榨取"的虚假人格以提升发电机效率
  社会影响: 暗网传说级物品·特管课SS级禁忌。传闻特管课捕获结社人员后也使用类似技术
