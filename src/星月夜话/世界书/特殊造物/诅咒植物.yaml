---
特殊造物-诅咒植物:
  分类: 生物培养
  通称: 魔素农园
  位置: 星月市地下废弃地铁站改造设施
  照料者: 具备植物操纵能力的超能力"园丁"
  已知植物:
    淫魔藤·缠身藤:
      外观: 深紫色藤蔓·红色花纹·自主蠕动·末端心形
      特性: 感知体温+魔力→自动缠绕。分泌透明粘液→接触产生灼热+麻醉+难以言喻快感
      用途: 非暴力拘束("不挣扎就没事·越挣扎越舒服")。粘液有成瘾性
    淫欲果·悦乐之果:
      外观: 似水蜜桃·切开后果肉粉色·浓郁甜香
      效果: ~4h情欲高涨·温和持久·不失去理智但降低性抑制+增加亲密渴望
      用途: 社交助兴·目标不察觉降低警惕。长期食用→不孕(深渊诅咒残留影响)
    深渊玫瑰:
      外观: 黑色花瓣+紫色纹路·花蕊淡蓝磷光。永不凋谢(摘下鲜活数月)
      效果: 花香精神干涉→对持有者产生好感信任。置于房间→对话融洽·攻击性降低
      获取: 培育极为困难(100粒种子仅3粒发芽·需稀释深渊精华浇灌)
      市价: 200万円/朵
    魔素苔·诅咒地毯:
      外观: 深绿色苔藓·阴暗角落生长·表面微弱荧光
      特性: 吸收环境魔力生长。孢子空气传播→吸入后体内缓慢生长汲取宿主魔力
      用途: 入侵前投放孢子削弱战斗力·基地通道种植形成"魔力屏障"
      危险: 墙角出现不自然苔藓→联系特管课(魔力浓度已达危险水平·或结社已来过)
    梦魇蘑菇(实验):
      外观: 粉紫色伞状·菌盖人脸花纹·夜间发光
      效果: 孢子吸入→清醒梦境(逼真色情幻象·五感完全模拟)
      用途: 非致命武器研究(散布孢子使敌方丧失战斗力)。15%接触者永久性幻视(未成熟)
