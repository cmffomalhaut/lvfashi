---
特殊造物-触手培养与契约戒指:
  分类: 生物科技+咒术契约
  ---
  触手培养技术:
    来源: 80年前深渊战争留下的深渊生物组织→诅咒营养液培养+深渊精华催化改良
    培养品种:
      拘束触手:
        尺寸: 2~3m长·3~5cm直径
        特性: 深紫色·细小吸盘。自动追踪缠绕魔力波动目标。吸盘接触产生微弱电击麻痹
        力量: ~300kg缠绕力·多条可完全固定每个关节
        用途: 结社基地标准防御·走廊·牢房·重要设施周围
      快楽触手:
        尺寸: 1~1.5m长·1~2cm直径·前端分叉
        特性: 表面细密绒毛分泌含神经兴奋剂的黏液。接触产生5~10倍正常快感
        用途: 调教室标配。持续快感攻击下大部分人30min内精神防线崩溃
        风险: 过度用→神经疲劳(暂时失去快感感知)·长期→对普通性行为失去兴趣
      寄生触手(最高机密):
        尺寸: 10~20cm长·极细(面条状)
        特性: 可经口腔/鼻腔/阴道进入寄生→与内脏和神经系统融合
        阶段:
          - 1~3d: 轻微饱腹感·体温升高·建立神经连接
          - 4~7d: 体内可感知触手活动→强烈性兴奋
          - 2~4w: 完全融合·意念控制活动·触手末端可从肛门/阴道伸出
          - 1月+: 持续供魔→触手可能体外繁殖分裂
        解除: 仅特管课和极少数中立医疗部门掌握驱魔液配方
  ---
  契约戒指:
    概述: 以深渊诅咒为媒介建立佩戴者间强制链接。主戒控制从戒
    市价: 50万~500万円(取决于功能和等级)
    种类:
      共享之环(初级):
        效果: 从戒感官体验实时单向传递给主戒。主戒可随时开关
        用途: 情报人员监视目标感官输入。也有"平等版"(情侣环)
      服从之证(中级):
        效果: 从戒无法拒绝主戒口头命令+服从产生愉悦反馈。长期形成条件反射
        额外: 主戒可感知从戒位置和心率·>1km范围电击惩罚
      灵魂之锁(高级·最高机密):
        效果: 灵魂层到肉体完整链接。主戒可抽取从戒生命力自愈·也可反向救治
        残酷用法: 管理者战斗中受伤→抽取素体生命力恢复→素体数秒内虚弱
        稀有: 邪神碎片刻印制造·目前≤5对
    黑市传闻: "无戒"新技术——一次契约之吻即可建立灵魂链接·无需戒指实体
