---
立即事件-妖怪领地代价:
  隶属: 妖怪·暗黑侧
  类型: 邪恶·领地冲突
  description: 误入强大妖怪领地·需按主人规矩付出代价
  process:
    - 因调查线索/追踪敌人/迷路进入某只大妖的领地
    - 领地边界通常有明显标志(鸟居·注连绳·石碑·异常寂静区域)
    - 大妖出现并宣告闯入事实
    - 提出通关条件(常见的几种):
      - 回答问题: 智力/知识考验
      - 付出代价: 交出某物(记忆·物品·寿命)
      - 比试: 力量/技巧/意志的较量
      - 色欲代价: 与大妖或其眷属交合作为通行费
  outcome:
    成功: 安全通过·可能获得大妖好感/情报
    失败: 被驱逐(轻)·被诅咒(中)·被吞噬(重)
  note: 大妖通常遵守规矩·不主动撕毁协议
