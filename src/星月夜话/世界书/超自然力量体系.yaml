---
超自然力量体系:
  总览: 六种已知体系 | 不同起源/原理/相性
        源自诅咒粒子对遗传因子的影响
        女性亲和力显著高于男性

  魔法(魔法少女/魔女):
    源起: 与契约之源的契约
    原理: 变身获得超越常人的力量
          契约之源给予符合内心的魔法武装
    特征: 变身状态能力大幅提升
          魔力消耗过度→变身解除甚至生命危险
          魔法少女之间有等级隐性排序
    分支: 魔女(绯红魔女结社)使用不同契约源
    相性:
      克: 妖怪 | 邪神造物
      被克: 咒术(封印系) | 结界

  咒术(阴阳师/天师):
    源起: 古代传承的咒术体系
    原理: 利用咒力驱动式神/符咒/结界
    特征: 擅长封印/净化/结界术
          式神使役(动物灵/付丧神/神使)
          咒术准备需要时间和材料
    分支: 诸夏天师(华夏道术体系)
    相性:
      克: 邪神诅咒 | 妖怪
      被克: 超能力(直接干涉) | 魔法(高速战)

  忍术(胧影之里):
    源起: 战国忍者流派的现代演化
    原理: 体术+查克拉+现代科技
    特征: 潜入/情报战/暗杀专精
          古流忍术与现代科技结合
          毒术/变装/机关术
    相性:
      克: 魔法师(近身战)
      被克: 超能力(感知系)

  气(武士武道):
    源起: 古武道·剑术·居合
    原理: 气力强化身体+武器
    特征: 不需要灵力/魔力天赋
          纯肉体修炼可达高阶战力
          武器附魔(气刃)
    相性:
      克: 咒术(近身破结界)
      被克: 魔法(远程风筝)

  灵力(巫女):
    源起: 神道·神社·祭祀
    原理: 通过与神明的连接使用灵力
    特征: 净化/祝福/结界专精
          大净解之仪的核心执行者
          对诅咒有天然抗力
    相性:
      克: 邪神诅咒 | 妖怪
      被克: 一般物理攻击

  超能力(无形学院):
    源起: 诅咒刺激大脑产生的异能
    原理: 精神力直接干涉现实
    特征: 能力类型随机(念动力/感知/时间系等)
          不受咒术/魔法体系规则约束
          难以被封印/无效化
          使用过度→诅咒侵蚀加速
    相性:
      克: 魔法师 | 咒术师
      被克: 无绝对克制(取决于具体能力类型)

  能力等级参考:
    F级: 略微强化(普通人可应付)
    E级: 明显强化(非战斗人员水平)
    D级: 职业战斗员基准
    C级: 精英战斗员
    B级: 城市级威胁
    A级: 国家级威胁
    S级: 战略级威胁(可改变区域力量平衡)
    论外: 无法测定的规格外存在(邪神级)

  力量体系共性原则:
    发动需消耗精神力/体力/魔力
    过度使用导致诅咒侵蚀加速
    高浓度诅咒环境能力增幅但失控风险↑
    里社会成员普遍具有双重身份(表身份+里身份)
