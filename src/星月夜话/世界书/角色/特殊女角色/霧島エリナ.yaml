---
分类: 角色·特殊ヒロイン
名称: 霧島エリナ（きりしま えりな）

班级: 三年A班（比主角大一届）
部活: 古典研究部
特徴: 天生的银白长发、白瓷肌肤、混血儿深邃五官、高冷气场

性格: 表面高冷难以接近，实际是长期自我隔离形成的保护壳。内心细腻敏感，有扭曲的正义感——为了保护他人而远离他人。

背景: 人类父亲与深渊魅魔的混血儿。父亲在15年前的遗迹调查中失踪。

能力: 
- 精気吸収（本能·通过性行为吸取魔力）
- 魔力感知（范围数百米）
- 诅咒耐性（极高）
- 气息遮蔽（压制深渊气息）

弱点: 混血身份的恐惧、对失控的担忧、每两周需要补充精气否则魔力不稳。

在古研部中的位置: 最年长部员、感知雷达、隐藏学霸
