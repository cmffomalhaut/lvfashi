---
生产制作协议:
  定位: 物品制作·装备强化·咒物炼成的规则框架
  制作分类:
    炼金术(灵力≥8): 药剂·咒物·诅咒物品
    锻造(武力≥8): 武器·防具·工具
    附魔(灵力≥10): 装备强化·咒文刻印
    咒术工艺(灵力≥12): 淫纹·拘束具·精神装置
  制作流程:
    Step_1: 获取配方(势力关系·秘境探索·黑市购买)
    Step_2: 收集材料(普_材料可购买·稀_材料需冒险·史_材料需剧情)
    Step_3: 满足制作条件(属性要求·工坊设施·特定技能)
    Step_4: 判定成功(属性检定+材料品质影响成功率)
    Step_5: 产出物品(品质受材料·属性·环境·诅咒浓度影响)
  品质体系:
    普_(普通): 基础效果·无特殊属性·成功率高
    良_(优秀): 额外+1属性·有轻微特殊效果
    稀_(稀有): 额外+2属性·有明显特殊效果·可能有使用限制
    史_(史诗): 额外+3属性·有强大特殊效果·通常唯一
  制作失败后果:
    轻: 材料损失·无产出
    中: 材料损失+受轻伤(诅咒侵蚀+5)
    重: 材料全毁+设施受损+诅咒侵蚀+15
