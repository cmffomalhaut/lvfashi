---
变量更新规则:
  星月市:
    当前时间:
      format: HH:MM
      check:
        - 每次场景推进、对话结束或行动完成后更新时间
        - 重要事件之间的时间跳跃应合理说明
    当前日期:
      format: YYYY年M月D日
      check:
        - 跨过午夜0点时更新日期
    当前季节:
      check:
        - 根据日期变化更替，每3个月换季
    当前天气:
      check:
        - 根据场景转换、时间推移自然变化
        - 重要剧情节点可用特殊天气烘托氛围
    当前地点:
      check:
        - 主角移动或场景切换时更新
        - 格式：星月市·${区域名}·${具体场所}
    场景氛围:
      check:
        - 根据当前场景的情绪基调更新
        - 反映光线、声音、人群状态等感官要素
  世界状态:
    表社会安定度:
      type: number
      range: 0~100
      check:
        - 重大治安事件、灾害、恐怖袭击等降低
        - 时间推移、危机解除、社会恢复可缓慢回升
        - 单次变化不超过 ±15
    里社会紧张度:
      type: number
      range: 0~100
      check:
        - 势力冲突、秘境爆发、强者对决时上升
        - 达成协议、危机平息、势力隐退时下降
        - 超过70可能引发全面冲突，低于20则处于和平期
    秘境活跃度:
      type: number
      range: 0~100
      check:
        - 秘境出现、扩张、不稳定时上升
        - 秘境关闭、封印加固时下降
        - 影响秘境出现的频率和强度
     诅咒浓度:
       type: number
       range: 0~100
       check:
         - 邪神封印松动、秘境活跃、月圆之夜上升
         - 大净解之仪、封印加固、咒物净化时下降
         - 超过60可能触发诅咒爆发，低于20则诅咒影响微弱
     时间带:
      type: '清晨 | 上午 | 中午 | 下午 | 傍晚 | 夜间 | 深夜'
      check:
        - 根据当前时间自动对应
    世界概述:
      check:
        - 总结当前世界整体态势，不超过100字
        - 突出当前最值得关注的矛盾或变化
  主角:
    属性.${武力|灵力|敏捷|精神|社交}:
      type: number
      range: 1~20
      check:
        - 训练、战斗突破、获得特殊力量时可增加
        - 长期不锻炼、重伤或诅咒可能减少
        - 单次变化不超过 ±3，除非有重大剧情事件
    阵营:
      check:
        - 当主角正式加入或退出某个势力时更新
    状态.${状态名}:
      type: |-
        {
          描述: string;
          剩余回合: number;
        }
      check:
        - 战斗中受到攻击、使用技能、中debuff时添加
        - 每经过一个行动回合，剩余回合-1
        - 剩余回合归零时自动移除该状态
     诅咒侵蚀度:
       type: number
       range: 0~100
       check:
         - 在诅咒浓度高的区域活动、被诅咒攻击、使用禁忌力量时增加
         - 接受净化、服用抗咒药物、时间推移可缓慢下降
         - 超过60会出现周期性诅咒爆发症状
         - 达到100将被深渊完全侵蚀
     标签.${标签名}:
       check:
         - 标签是叙事性描述，如"浑身湿透""月光笼罩""怒气冲天""发情状态"
         - 根据剧情情境添加或移除
    持有物.${物品名}:
      type: |-
        {
          描述: string;
          数量: number;
        }
      check:
        - 获取、消耗、交易时更新数量
        - 数量归零后自动移除
  活跃角色.${角色名}:
    阵营:
      check:
        - 角色改变所属势力时更新
    立场:
      type: '友善 | 中立 | 敌对 | 未知'
      check:
        - 根据与主角的互动和剧情发展更新
        - 重大事件可能直接改变立场
    属性.${武力|灵力|敏捷|精神|社交}:
      type: number
      range: 1~20
      check:
        - 仅在角色有明显成长或受创时才更新
    状态.${状态名}:
      type: |-
        {
          描述: string;
          剩余回合: number;
        }
      check:
        - 战斗中或剧情中被施加状态时添加
        - 超出上限时自动移除最早的状态
    诅咒侵蚀度:
      type: number
      range: 0~100
      check:
        - 在诅咒浓度高的区域活动、被诅咒攻击、使用禁忌力量时增加
        - 接受净化、服用抗咒药物、时间推移可缓慢下降
        - 超过60会出现周期性诅咒爆发症状
    标签.${标签名}:
      check:
        - 叙事性标签，用于反映角色的临时状态或特征
  hp:
    type: number
    check:
      - 受伤减少，治疗/休息回复
      - 不超过hp上限，不低于0
  mp:
    type: number
    check:
      - 使用能力/魔法减少，自然恢复或药物回复
      - 不超过mp上限，不低于0
  势力.${势力名}:
    影响力:
      type: number
      range: 0~100
      check:
        - 重大成功行动、扩张、吸纳强者时增加
        - 重大损失、失败、内部动荡时减少
        - 超过80为该市主导级势力，低于20为边缘存在
    当前动向:
      check:
        - 描述该势力近期的主要行动和目标
        - 与主角交互或剧情推进时更新
    关系.${目标势力}:
      type: '同盟 | 友好 | 中立 | 紧张 | 敌对 | 战争'
      check:
        - 事件、利益冲突或合作时更新
        - 跨越两级需要重大事件触发
  事件.${事件名}:
    进度:
      type: number
      range: 0~100
      check:
        - 根据剧情推进更新，主角的行动直接影响进度
        - 达到100时状态变为"已完成"
    状态:
      type: '进行中 | 待触发 | 已完成 | 失败'
      check:
        - 达到触发条件时从"待触发"转为"进行中"
        - 进度100转为"已完成"
        - 不可抗力导致无法完成转为"失败"
  秘境.${秘境名}:
    稳定度:
      type: number
      range: 0~100
      check:
        - 受外力干涉、内部崩溃时下降
        - 自然恢复或封印加固时上升
        - 稳定度为0时秘境崩溃或关闭
    状态:
      type: '开放 | 不稳定 | 即将关闭 | 已关闭 | 未知'
      check:
        - 根据秘境稳定度和外部影响更新
