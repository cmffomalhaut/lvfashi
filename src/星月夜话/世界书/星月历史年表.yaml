---
星月市历史年表:
  纪元前:
    古结界: 城市地基下存在古代结界遗迹
             实际为某未知文明留下的封印网络
             后被1945年讨伐战利用为核心封印基盘

  1945年:
    邪神降临: 噬渊之主在原址上空撕开次元裂缝
              全球里社会紧急集结: 欧洲秘法骑士团/华夏龙虎山天师/日本阴阳道宗家/南洋降头师/美洲巫毒教派
    大讨伐战: 持续47天的超规格战斗
              付出惨烈代价后击溃并封印噬渊之主
    星月诅咒诞生: 邪神崩碎时的诅咒粒子渗入大气/土壤/海水
                  成为永久性环境污染
    封印孔: 城市地基深处与深渊相连的封印点
            至今由阴阳寮+特管课共同看守

  战后1945-1950:
    遗传影响: 诅咒导致女性出生率远超男性
              最严重时期男女比例达1:8
    能力偏向: 女性对超自然亲和力显著高于男性
              里社会女性比例压倒性多数
    创始: 各大势力发起大净解之仪(初春净化仪式)
          巫女/阴阳师/神父/天师等共同主持
    余波至今: 性别比例恢复至约4:1(女:男)
              里社会活跃成员中女性占约75%
              完全消除诅咒至今仍是不可能的目标

  1999年:
    建市: 星月市正式建立
          发现古代结界遗迹与封印网络
    秘密协议: 市政府与超自然势力达成协议
              容许彼等在遵守隐藏原则的条件下活动

  2010年:
    第一次秘境爆发: 多个秘境同时出现在北郊
                    引发里社会大规模冲突
    结局: 阴阳师联合官方机构封印主要出口

  2018年:
    血色情人节: 邪恶结社在市中心发动大规模诅咒仪式
               被魔法少女+阴阳师联手阻止
    特管课成立: 官方对策机构正式建制

  2023年:
    机械黎明会首次被发现: 特管课在调查一起"全区魔力短暂失灵"事件时追踪到可疑科技装置
    评估: 判定为新兴技术结社·列为潜在威胁

  2024年:
    秘境活跃期: 旧的封印松动, 新的秘境不断出现
               各大势力开始新一轮布局和博弈
    诅咒上升: 观测到诅咒浓度周期性上升
              大净解之仪效果在减弱
    黑潮群岛异常: 岛上神社封印的黑石出现裂痕·引发里社会关注
    静默修会首次活动确认: 一处小型秘境遭不明人士永久封印
                          现场留下拉丁文"PURGANDUM"

  2025年4月(现在):
    节点: 距离下一次大净解之仪还有三周
          樱花盛开的星月市
    暗流: 某些势力正在利用诅咒的新方法
          星之钥匙收集传闻浮上台面
    主角登场: 古典研究部的废部危机倒计时
              校园+里世界的命运齿轮开始转动
