    势力均衡: 无单一势力能统治星月市
              多方博弈形成的脆弱平衡是城市稳定基础
    诅咒法则: 邪神诅咒=力量的催化剂+侵蚀的根源
              女性对诅咒的亲和力/转化力显著高于男性
    秘境法则: 异世界碎片因结界松动周期性出现
              每个秘境有独特法则, 资源与危险并存

  表社会现状:
    安定度: 85/100
    认知: 市民对超自然一无所知
    异常处理: 超自然事件以事故/刑事案件名义掩盖

