星月夜话世界观总纲:
  世界定位: 现代都市·日本·星月市
  世界基调: 表里共存的群像剧——日常校园与超自然暗战的交织
  核心矛盾: 八十年前弑神留下的诅咒遗产，至今仍在侵蚀这座城市
  当前态势: 秘境活跃化 | 诅咒浓度周期性上升 | 势力平衡微妙倾斜
