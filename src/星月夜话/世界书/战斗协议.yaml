---
战斗协议:
  定位: 星月夜话回合战斗规则基础框架
  触发时机: 进入战斗状态时激活(initvar.战斗.进行中=true)
  核心原则:
    - 回合制: 每轮各行动方完成一次行动
    - 行动顺序: 按敏捷属性排序(从高到低)
    - 每回合可选择: 攻击·技能·防御·逃跑·使用道具
  属性体系:
    武力: 物理攻击力和近战伤害
    灵力: 魔法攻击力和咒术效果
    敏捷: 行动顺序和闪避率
    精神: 意志抗性和MP上限
    社交: 交涉能力和伪装判定
  战斗流程:
    Step_1: 行动顺序确定(initvar.战斗.行动顺序=参与者按敏捷排序)
    Step_2: 当前行动者选择行动
    Step_3: 判定成功/失败(武力vs武力·灵力vs灵力等对抗)
    Step_4: 执行效果(伤害·状态变化·诅咒侵蚀等)
    Step_5: 检查战斗结束条件(HP归零·逃跑成功·投降)
    Step_6: 轮换下一位行动者
  特殊规则:
    掩护: 可代替相邻友方承受攻击(掩护者承受伤害*1.5)
    连携: 多个友方连续攻击同一目标时伤害+20%
    背袭: 从敌人视野外攻击时必中且伤害*1.5
    诅咒爆发: 诅咒浓度>60时战斗中有概率触发异常事件
  战斗结束:
    - 胜利: 获取经验/战利品/情报
    - 逃跑: 成功脱离战斗但无收益
    - 败北: 角色虚弱·失去部分持有物·可能被捕获
