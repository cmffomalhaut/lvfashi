---
镜之迷宫:
  定位: 映照"另一種可能"的鏡像迷宮
  入口: 大型落地鏡·百貨商場試衣間鏡子
  狀態: 穩定
  穩定度: 50
  危險度: 6
  環境: 無數鏡面構成的巨大迷宮，每面鏡中映現"另一種可能的自己"
  規則:
    - 可穿越任何鏡面→釋放鏡中"另一種可能性"實體化
    - 迷宮中會遭遇"另一個自己"（可能敵對/友方/中立）
    - 迷宮中獲得的物品離開後化為普通玻璃碎片
    - 迷宮中受到的傷害以"心理性傷害"形式延續至現實
  管理者: 鏡之魔女（迷宮核心的意志體現）
  產物: |
    普_情報（鏡中獲取）
    史_"鏡之核"（可實現一個願望的代價物）
