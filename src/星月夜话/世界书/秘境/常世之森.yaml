---
常世之森:
  定位: 時間失去意義的遠古原始森林，連接常世與現世
  位置: 市郊深山（魔法師協會舊址附近）
  狀態: 不穩定
  穩定度: 35
  危險度: 7
  環境: 永遠籠罩神秘光輝的原始森林，時間感知嚴重扭曲（感覺數小時→實際可能數分鐘，或反之）
  規則:
    - 森林中禁止使用火焰→激怒精靈與樹精
    - 林中果實可食用但部分致幻
    - 禁止傷害精靈→被森林排斥並迷失
    - 找到生命之泉可淨化特殊詛咒/狀態
  管理者: 森之精靈（自然精靈·中立·警戒心強）
  產物: |
    普_藥草素材、珍稀果實、魔法植物
    稀_治療/淨化泉水（生命之泉）
