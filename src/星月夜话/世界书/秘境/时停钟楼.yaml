---
时停钟楼:
  定位: 時間完全靜止的永夜鐘樓
  入口: 深夜電梯·特定高層建築的緊急樓梯間
  狀態: 不穩定
  穩定度: 30
  危險度: 7
  環境: 永遠停留在某個夜晚的巨大歐式鐘樓，內部時間完全停止。進入者不會衰老、不會飢餓、不會疲勞
  規則:
    - 實際停留時間與感受時間嚴重脫節（感受數月→實際可能僅一小時）
    - 每層樓是一個"時間片段循環"→反覆體驗某個場景
    - 樓中獲得的技能/知識在離開後保留
    - 強行攻擊管理者→被時停"一萬次死亡"
    - 從頂樓可離開，但失去樓內所有記憶
    - 不同樓層流速不同→越高層流速越慢
  管理者: 時之魔女（孤僻·接待感興趣的訪客·討厭無趣之人）
  產物: |
    普_時間結晶（消耗品·加速/暫停局部時間）
    稀_技能熟練（長時間修煉所得）
    史_時之魔女的知識（需通過考驗）
