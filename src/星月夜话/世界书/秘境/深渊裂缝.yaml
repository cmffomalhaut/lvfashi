---
深渊裂缝:
  定位: 通往未知深淵的空間裂縫——"現實之間的間隙"
  位置: 舊城區廢棄地鐵站最深處·多個城市底部
  狀態: 極不穩定
  穩定度: 15
  危險度: 9
  環境: 黑暗、扭曲、混沌的虛空裂縫，深淵氣息與不可名狀之物蔓延。裂縫本身在不斷侵蝕周圍現實
  規則:
    - 禁止進入——這是所有勢力的共識
    - 長期接觸深淵氣息→被侵蝕（身體異變·精神扭曲·魔力污染）
    - 深淵低語放大內心最深處的負面情感與慾望
    - 傳聞穿越深淵可抵達"另一側"——但從未有生還者確認
  管理者: 深淵本身（不可名狀·極度敵對·無法溝通）
  產物: |
    稀_禁忌知識（代價極高）、深淵結晶（研究用·極度危險）
    史_扭曲之力（臨時力量增幅·高污染風險）
  備註: 管理局24小時監控·張拉了結界·定期前沿加固
