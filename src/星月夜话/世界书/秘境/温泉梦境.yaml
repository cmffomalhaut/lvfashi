---
温泉梦境:
  定位: 以"極樂淨土"集體願望構築的溫泉療癒秘境
  入口: 繁華街隱密高級溫泉設施·大規模天然溫泉·隨機出現在"欲望"足夠強烈的入浴者身邊
  狀態: 穩定
  穩定度: 60
  危險度: 4
  環境: 雪山下露天溫泉群，蒸氣瀰漫溫暖舒適。不同顏色溫泉有不同功效
  規則:
    - 男女之別在此無意義→秘境只區分"心"與"慾望"
    - 不同顏色溫泉水效果不同→紅(治癒)·藍(魔力恢復)·紫(精神淨化)·金(傳說級)
    - 過度沉溺者→短期失去現實行動力（需同伴護送）
    - 在水精靈注目下可放心放鬆→被測量"心靈純度"
    - 離開後保留大部分恢復效果
    - 最深處"源泉"→一次徹底治癒某種創傷或缺失
  管理者: 水精靈們（調皮但友善·喜歡健美者）
  產物: |
    普_治癒恢復、美容美體、精神狀態淨化
    稀_長期增益狀態（受水精靈祝福）
  備註: 無武裝人員最受歡迎·溫泉中禁止戰鬥·水精靈會攻擊戰鬥者·談判/情報交換在池邊進行·以非常坦誠的態度
