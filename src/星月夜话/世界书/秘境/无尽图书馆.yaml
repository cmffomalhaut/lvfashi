---
无尽图书馆:
  定位: 知識與記憶的無限書庫，藏書涵蓋已存在與可能存在的一切知識
  入口: 市立大學校舍·地下避難所·魔法師協會實驗室深處
  狀態: 穩定
  穩定度: 75
  危險度: 4
  環境: 由無盡書架構成的無限空間，每位訪客看到不同景象（映射其知識興趣）
  規則:
    - 每次進入位置皆不同
    - 禁止損毀書籍→違者被逐出並永久禁止進入
    - 可借出書籍但必須歸還→逾期遭"管理員"追索
    - "禁書區"需特定權限方能進入
  管理者: 圖書館管理員（溫和但堅定，保護所有書籍）
  產物: |
    普_知識情報、常識性書籍
    稀_魔法書、古代文獻、技能指南
    史_禁書（含禁忌知識·特殊權限要求）
