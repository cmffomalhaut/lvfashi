---
蜜壶回廊:
  定位: 以"甜美囚禁"为本能的活体迷宫秘境
  入口: 地下深处的裂縫·废弃地铁隧道尽头·某栋旧楼的底层被封堵的门后
  状态: 稳定·但范围在缓慢扩张
  稳定度: 30
  危险度: 7
  建议等级: 13~18
  环境: 通道由粉红色的柔软活体组织构成·触感温暖·微微脉动
        空气甜腻·带着类似蜂蜜与乳汁混合的香气·令人昏昏欲睡
        墙壁渗出透明的温润液体·沾到皮肤上会微微发热
        光源来自壁面上发光的脉络·呈淡金色·忽明忽暗
  背景: 传说是一头被封印在地下的古老淫兽的消化腔演变而成
        也可能是在某次大规模情欲诅咒集中爆发时·集体欲望结晶化的产物
  结构: 共4层·越深处越温暖·越"令人不想离开"

  第一层——蜜涎回廊:
    环境: 通道较宽·墙壁光滑柔软·地面铺满温热液体(没脚踝)
          光线昏暗·甜香浓郁·但尚可保持清醒
    怪物: 史莱姆状蜜仆(人形·半透明·行动缓慢·纠缠为主)
          漂浮的花粉团(触碰引发轻度催情效果)
    机制: 首次进入需通过"甜蜜试炼"——抵抗通道深处的低语诱惑
          低语会告诉你"继续往前走太危险了·就在这里停下吧·很舒服的"
          意志薄弱者会就地坐下·陷入甜美沉睡·被慢慢吸收
    掉落:
      普_蜜露晶体(消耗品·微回复+轻微催情)
      普_柔软丝线(素材·可编织触感极佳的衣物)
      稀_蜜香琥珀(镶嵌物·佩戴后散发微弱催情香气)

  第二层——暖脂之厅:
    环境: 开阔如大厅·四壁覆盖厚厚脂肪层·踩上去下陷半寸
          中央有一池温热的乳白色液体·池底隐约可见浮雕
          温度升高·衣物开始让人感到不适
    怪物: 蜜仆进阶·拥有些许智慧·会模仿人形轻声劝说
          墙壁深处伸出柔韧的触须·缠绕肢体·不伤人·但越缠越紧
    机制: "暖脂浴"——池水会激发身体的愉悦感·让人想脱掉衣物浸入其中
          每在池中多待一分钟·离开的意愿就减弱一分
          需要队友或自醒才能脱离
          据说池底浮雕记载着某种古代房中术的残篇
    掉落:
      普_温脂精油(消耗品·涂抹后短时间内提升魅力)
      普_触须标本(素材·有微弱活性)
      稀_浮雕拓片(记载古代性技残篇·可用于情报交易)
      稀_饱满脂玉(炼金材料·壮阳/魅惑药剂的核心成分)

  第三层——芯核之房:
    环境: 通道变窄·墙壁收缩成肌肉般的结构·有节律地蠕动
          空气炽热·湿度极高·呼吸变得急促
          隐约可听见低沉的哼鸣·像巨大的心脏在跳动·又像某种呻吟
    怪物: 芯核守护者——由活体组织凝结成的类人女性形体
          身材极其诱人·动作优雅·不主动攻击
          她的"攻击"是抚摸·拥抱·亲吻·每一个接触都令人难以抗拒
          被纠缠时间过长→陷入永久的"芯核同化"
    机制: 守护者不与你战斗→她"侍奉"你
          被她完全侍奉的人会微笑着融入墙壁·成为回廊的一部分
          击败她的唯一方法是"拒绝她"——在侍奉过程中保持清醒和拒绝
          拒绝到最后她会哭泣→墙壁收缩试图把你挤出去
          这是整个秘境唯一强制驱逐机制
    掉落:
      稀_芯核之泪(极稀有消耗品·使用后彻底净化一次诅咒·极其珍贵)
      稀_守护者的发丝(素材·可制作魅惑抗性装备)
      稀_温暖晶核(装备核心·赋予装备"生命亲和"属性)
      史_守护者的契约(特殊道具·可以召唤守护者一次协助战斗·性暗示强烈)

  第四层——子宫之室(BOSS层):
    环境: 一个巨大的球形空间·墙壁呈半透明膜状·透出温暖的光
          中央悬浮着一枚巨大的"卵"·约两人高·表面半透明·内有蜷缩的人影
          地面温热·踩着像皮肤·空气中弥漫着让人意识模糊的甜香
    首领: "胎之母"——蜜壶回廊的核心意识体现
          形态: 从卵中半身探出的女性形态·长发及地·身体湿润发光
          她看起来像是"所有母性的集合体"·令人感到安心和依恋
    战斗: 她不直接攻击→她会召唤被同化的蜜仆(前代冒险者)来拦截
          她的真正力量是"劝降"——用最温柔的话语问你是否累了·想休息了
          每成功抵抗一次·她的形态就衰老一分
          战胜她的方式不是打倒→而是让她承认"无法留住你"
          当她意识到你真正要离开时·她会最后一次拥抱你·然后开放出口
    通关条件: 走到第四层深处·找到出口击败胎之母的意志·或者不击败她而是让她放手
    特殊结局: 如果被胎之母说服留下来→角色永久被困·但获得"永恒的甜美梦境"
              可转为NPC·作为后续冒险者的阻碍之一
    掉落:
      史_胎之母的祝福(永久饰品·大幅提升魅力·对催情效果获得额外抗性)
      史_卵壳碎片(防具素材·蕴含生命力·可制作传说级防具)
      史_【蜜壶之匙】(唯一·可安全进出蜜壶回廊的凭证·极其珍贵)
      传_母神的低语(特殊技能书·习得后可以在战斗中发动一次"强制安抚")
