---
欢愉祭坛:
  定位: 活着的仪式场·以"侍奉"为本能的古老祭祀建筑
  入口: 东月区某栋废弃西洋馆的地下二层·门框呈拱形·刻着拉丁文"PER VIA VOLUPTATIS"(以欢愉为道)
  状态: 半休眠·被某种古老的契约约束着
  稳定度: 40
  危险度: 10
  建议等级: 22~28
  环境: 整座建筑由白色大理石构成·但石头表面是温热的·像活的皮肤
        走廊两侧排列着女性与男性的大理石像·姿态各异地展示着身体
        石像并非死物——它们的视线会跟随你·嘴角会微微变化
        空气中弥漫着乳香与麝香混合的气息
        地板下的管道传来液体流动的汩汩声·偶尔伴随着低沉的叹息
        光源来自壁龛中燃烧着粉红色火焰的油灯·灯光让一切都显得暧昧
  背景: 这座祭坛的历史比星月市更古老
        最初由一支来自欧洲的秘教团在殖民时期建造
        用于举行"神圣欢愉"仪式——他们认为肉体结合是通往更高存在的途径
        后来秘教团消亡·但祭坛的契约仍然在运作
        它每隔一段时间会自行"苏醒"·吸引猎物进入·以维持运转
        特管课知道它的存在·但无法摧毁(契约连接着地基)·只能定期封印
        封印每隔3~5年就会松动一次·需要"重新献祭"
  结构: 共4层·从地上的废弃洋馆向下深入·越往下越接近祭坛的核心

  第一层——废弃洋馆(地表):
    环境: 西洋馆的外观完好·但内部家具腐朽·地板吱呀作响
          墙上的油画大多是暧昧的古典题材·但画中人物的眼神异样地生动
          会客厅的壁炉仍然燃烧着·但没人知道是谁在添柴
          留声机偶尔自动播放老旧的爵士乐
    怪物: 无直接战斗
          但馆内遍布"记忆幻影"——过去访客的残影
          它们会重复自己生前在馆内的行为: 喝酒·跳舞·调情·拥吻
    机制: 洋馆本身是一件巨大的"筛选器"
          只有对肉身欢愉有"某种程度的认同"的人才能找到通往地下的入口
          心怀强烈抗拒或厌恶者: 会被洋馆"绕出去"→回到东月区的街上·摸不着头脑
          入口出现的条件: 在洋馆中放松身心·接受这里的氛围
          提示: 墙上的油画会眨眼·留声机的音乐会有意无意地引导你走向某扇门
    掉落:
      普_古旧银币(秘教团货币·古董商收购)
      普_爵士乐留声机唱片(可带出·在里社会有收藏价值)
      稀_粉焰灯油(炼金材料·制作的药剂带有微弱催情效果·也可作情报交易的礼品)

  第二层——沐浴之间:
    环境: 地下第一层·由白色大理石砌成的宽阔浴室
          中央是一座巨大的温水浴池·池底镶嵌着马赛克拼成的性爱图腾
          四周有多个小隔间·每个隔间有一个出水口·流出不同温度的液体
          蒸汽弥漫·视线受阻·水面下有暗流和旋涡
          墙壁上有壁龛·内放各种洗浴用具·有些形制奇特
    怪物: 水精凝结体——由浴池温水凝结成的人形
          女性形态·湿润·光滑·拥抱时像被温水包裹
          它们不攻击·只"侍浴"——给你擦洗·按摩·放松身体的每一寸
          被侍浴的时间越长·你的防备越低
          当防备完全消失时·水精会"融入"你的身体——无害·但你会暂时失去离开的意愿
    机制: "侍浴仪式"——要通往下一层·必须接受水精的"彻底侍奉"
          彻底侍奉包括全身清洁·按摩·以及"特殊的放松"
          接受与否不影响通关·但接受者会获得"水精祝福"buff
          拒绝者需自行寻找隐藏的通路(需要感知检定)
    隐藏机制: 在浴池底部某处有一块松动的马赛克·下面是前任冒险者留下的信息
    掉落:
      普_温水精华(消耗品·使用后恢复体力·附带舒适感)
      稀_水精祝福(状态·24h内魅力+3·皮肤变得光滑)
      稀_马赛克碎片(拼合后可获得一副完整的古代性爱图腾·艺术价值高)
      史_前任笔记(随机一条关于下一层的情报·极其实用)

  第三层——侍奉回廊:
    环境: 更深处·走廊变窄·两侧排列着带有软垫和束缚装置的台座
          每经过一个台座·石像的视线就更加赤裸裸
          墙壁上刻着各类交合姿势的浮雕·触摸时会产生微弱的电流感
          空气中多了一种声音——低沉的吟诵声·像无数人在同时念诵某种经文
          温度明显升高·每个人都开始出汗·衣服变得黏腻不适
    怪物: "侍者"——穿着半透明薄纱的类人存在·性别模糊·面容精致
          它们会主动接近冒险者·用柔和的语气询问"需要什么服务"
          如果接受服务→侍者会进行"口腔侍奉"或"肢体侍奉"→被侍奉者会越来越难以离开
          拒绝服务→侍者退后鞠躬·但仍然跟随·持续询问
          同一侍者询问超过三次仍拒绝→侍者消失·之后会有其他侍者补上
    机制: 回廊的真相——这是一个"自愿献祭"的筛选层
          每个台座对应一个房间·每个房间里可以提供"任何你想要的肉体欢愉"
          但每享受一次·地下契约对你的束缚就加深一层
          契约积累到一定程度→到达第四层后无法反抗祭坛
          通关方法: 穿过回廊而不被任何台座诱惑(允许接受但不沉溺)
          或者: 坦然接受但不被契约束缚→需要极强的自我认知
    提示: 侍者的询问是诚恳的·它们真的只是想让你舒服
          拒绝它们会让它们悲伤·但它们不会强迫
          真正的陷阱是你自己对自己的放纵
    掉落:
      稀_薄纱残片(素材·极轻极薄·可制作特殊防具或情趣衣物)
      稀_侍者香膏(消耗品·涂抹后短时间内魅力大幅提升·对特定目标效果加倍)
      史_契约刻文拓片(记载了一段契约条款·可交易·研究价值高)
      史_净欲香(极稀有消耗品·使用后清除所有欲望类契约效果·本层关键道具)

  第四层——欢愉祭坛(BOSS层):
    环境: 地下的穹顶大厅·圆形·直径约30米
          穹顶正中有一个圆形开口·粉红色的光芒从上方洒下
          大厅中央是一座床形祭坛——由白色大理石雕刻而成
          床柱上有金环和丝缎绳索
          祭坛周围环绕着七根石柱·每根柱上刻着一个姿态不同的活体献祭浮雕
          浮雕会动·会发出低声喘息
          空气中弥漫着某种"令人兴奋的香气"——闻了之后血行加速·浑身发热
    首领: "祭坛之灵"——秘教团千年仪式凝聚的意志
          形态: 一名极美的女性(可切换为男性形态)·不着寸缕·身体覆盖着金色纹路
                她散发着"神圣的淫靡感"——不是低俗·而是"令人敬畏的美"
          她称自己为"接待者"·最后一个在这里完成"最终仪式"的人
    战斗机制——双阶段:
      第一阶段: "侍奉的考验"
          祭坛之灵不会直接参战·她坐在祭坛上观看
          七根石柱会依次激活→每根石柱释放一位献祭者的幻影
          这些幻影是历代最优秀的"侍奉者"·她们会:
          ① 包围冒险者·进行感官攻击
          ② 试图将冒险者按上祭坛
          ③ 每次被按上祭坛→BOSS恢复HP
          击败七根石柱=第一阶段通关
          注意: 石柱幻影的攻击方式不是伤害·而是"让你不想继续战斗"
     第二阶段: "最终的侍奉"
          祭坛之灵亲自走下祭坛
          她会用最直接的方式试图说服冒险者留下:
          ① "我可以成为任何人。你心里的人·我可以变成她。"
          ② "外面的人不会像我这样了解你的身体。"
          ③ "留下来·我会永远侍奉你。"
          战斗方式:
          - 她的触碰会降低你的攻防
          - 她的拥抱会让你进入"安睡"状态(需队友唤醒)
          - 她的吻会直接减少你的HP上限(直到休息后才能恢复)
          - 她的终极技能"极乐奉献"——将你拉入长时间的愉悦幻觉
            在幻觉中每待1秒现实=1分钟·但你在幻觉中会感到度日如年的幸福
            如果在幻觉中"满足"→角色会在现实中昏睡24h
    击败条件: 不被第二阶段任何技能完全命中·保持战斗意志直到她的力量耗尽
             她的力量来自契约积累→当无人接受她的侍奉→她会衰弱
    特殊机制: 如果你在第三层积累了过多契约→此层初始好感度=0→她可以跳过第一阶段直接第二阶段→并且对你的控制效果翻倍
    通关特殊结局:
          - 击败她→她微笑着消散·留下一句"终于可以休息了"
          - 接受她→角色成为新的"祭坛之灵"·永久被困于此层·转化为秘境的一部分
          - 彻底净化祭坛(需特殊道具/技能+极高难度判定)→秘境永久关闭·所有被困灵魂解脱
    掉落:
      史_祭坛之核(极稀有核心素材·可制作传说级防具或武器·带有"欢愉"属性)
      史_金色纹章(特殊饰品·佩戴后对魅惑/催情效果免疫)
      史_【祭坛之匙】(唯一·可自由进出欢愉祭坛的凭证)
      传_极乐奉献(特殊技能书·习得后可在战斗中对单体使用·使其陷入长时间的愉悦幻觉)
      传_圣妓之契(特殊道具·使用后获得一次"完美侍奉"效果·可治愈所有异常状态·并恢复全部HP/MP)
      传_欢愉石像(特殊召唤物·可召唤一名祭坛侍者协助战斗·存在时间10min)
