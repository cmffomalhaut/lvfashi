---
妖精乐园:
  定位: 以人類"快樂"為能源的扭曲歡樂主題公園
  入口: 瀕死體驗·極致痛苦後的幻夢·昏迷狀態
  狀態: 穩定
  穩定度: 70
  危險度: 3
  環境: 巨大的歡樂主題公園，摩天輪旋轉木馬鬼屋——一切以"快樂"為名營運
  規則:
    - 普通遊客不會遭受攻擊，但若表現出強烈幸福→可能突然消失（變成能源）
    - 樂園中不能說"不想玩了"→會被加倍挽留
    - 獲得優勝者參與宴會→可能獲得暫時性祝福/詛咒
    - 試圖傷害管理員→被其他遊客（能源）一擁而上壓制
    - 管理者核心願望不涉及直接傷害（除非妨礙"快樂"）
    - 離開樂園後獲得的快樂相關實物化為枯葉與灰燼
  管理者: 妖精王（喜歡"快樂"與"有趣"的旁觀者）
  產物: |
    普_祝福（短暫好運）、稀有材料、快樂之瓶
  備註: 妖精王特別喜歡"表演者"或"有趣的人"。若表演夠精彩，可能被請進"特別包廂"。
