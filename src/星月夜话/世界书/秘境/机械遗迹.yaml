---
机械遗迹:
  定位: 廢棄高等文明的機械都市廢墟
  位置: 工業區港口倉庫·特定地鐵隧道內部的大型隱藏空間
  狀態: 穩定
  穩定度: 65
  危險度: 5
  環境: 金屬與機械構成的巨型廢都，銹蝕建築、停止轉動的機器人殘骸與未知機械裝置遍布
  規則:
    - 城中科技設備可回收，但需破解其控制系統
    - 防禦系統仍處於活躍狀態
    - 不要試圖拆解過多機械→會觸發"城市防衛協議"
    - 核心機房需特殊"權限密鑰"方能進入
  管理者: 自動化系統（無差別防禦·千年未停機）
  產物: |
    普_科技零件、金屬材料（含稀有合金）
    稀_高階裝備（需修復）、核心能源
    史_權限密鑰（可控制部分系統）
