---
极乐回廊:
  定位: 欲望成形與沉溺的誘惑空間
  入口: 繁華街道·深夜開業的俱樂部·情趣旅館的鏡子
  狀態: 穩定
  穩定度: 40
  危險度: 6
  環境: 粉紅與玫瑰色調的柔軟空間，牆壁由肉色軟組織構成，空氣中飄浮催情花粉
  規則:
    - 空間根據訪客欲望自動變形→想要什麼出現什麼
    - 沉溺於快樂並失去自我→被同化為新的眷屬
    - 意志堅定者可能利用此空間反控→獲取情報/認知
    - 輕微治癒/恢復效果→但長時間暴露導致判斷力下降
    - 接受核心欲望後離開→永久失去"某種重要的可能性"
  管理者: 魅魔女王（善於利用魅力·偽裝友善）/特殊存在
  產物: |
    普_快樂結晶(消耗品)、記憶碎片（情報交易用）
    稀_特殊藥物（短時間強化）
  備註: 意志脆弱的"夢想家"最危險→被視為"未知的創作素材"自行保留
