---
旧校舍异界化:
  定位: 被戰爭怨念侵蝕的廢棄校舍異界
  位置: 櫻台學園舊址邊緣·廢棄學校·老舊封閉的宿舍
  狀態: 不穩定
  穩定度: 45
  危險度: 7
  環境: 白天為普通廢棄校舍，日落後異界化為無盡的"戰爭學園"——八十年前紛爭犧牲者的思念體集合
  規則:
    - 每個教室的"規則"不同→有的禁止說話、有的必須回答問題、有的需要完成作業
    - 校舍深處的"保全室"可能有特殊藥品
    - 游泳池有強力Boss級怨念體鎮守
    - 在校舍受傷→現實中也會出現對應傷口
    - 極度恐懼可能"逃離"這片秘境→但逃出的可能不是自己
  管理者: 怨念體群（對"怨念"強烈反應的思念集合體）
  產物: |
    普_紛爭戰史殘片、學生私物（黑市中古品）
    稀_淨化道具、特殊實戰經驗
    史_校舍完整記錄（可揭露某場紛爭的真實歷史）
  備註: 校舍中有隱藏"傳說":舊校舍母親（天台彈安眠曲→無法拒絕聆聽）;體育館十戰（完成十種競技才能離開）;理科室人體模型（移動到特定位置）;泳池鑰匙（需水性泳圈才能離開）
