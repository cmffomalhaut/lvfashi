---
沉欲之沼:
  定位: 被遗弃的古代情欲祭祀场·现已沦为欲望具象化的沼泽秘境
  入口: 北郊山林深处的迷雾沼泽·只有在特定月相时才会出现通路
  状态: 不稳定·周期性扩张和收缩
  稳定度: 20
  危险度: 9
  建议等级: 17~23
  环境: 无尽的灰绿色沼泽·水面覆盖着发光苔藓·踩上去泛起动情的磷光
        空气中飘荡的水雾带着奇异的腥甜味·吸入后身体微微发热
        水面下隐约可见白色的人形轮廓·在深处游弋
        枯树扭曲成人类交合姿态的形状·偶尔发出低沉的呻吟
        整个沼泽像一个巨大的活体器官·每一次呼吸都在增幅欲望
  背景: 数百年前某个邪教在此建立祭坛·以交合仪式供奉深渊中的某位存在
        后来祭坛被毁·但仪式场地经年累月积累的情欲能量渗入水土
        形成了这片会"读取欲望"的沼泽·它会将你内心深处不愿面对的情欲显形
  结构: 共4层·从沼泽边缘向中心推进·越深处越直面本心

  第一层——欲望浅滩:
    环境: 沼泽边缘·水深及膝·水底是软泥
          随处可见倾倒的石柱和残破的人形雕像
          雕像姿势暧昧·大多残缺不全
          水雾较薄·能见度尚可
    怪物: 水雾凝成的魅影(半透明女性形体·发出轻声呻吟·触碰引发轻微欲念)
          沼泽的气泡→破裂时释放出催情气体
    机制: 沼泽会读取你的表层欲望——你最表面的性幻想
          这些幻想会以幻影形态出现在你面前·试图引诱你偏离路线
          不需要战斗·屏住呼吸快速穿过即可
          但如果驻足欣赏→幻影会实体化·变成纠缠你的怪物
    掉落:
      普_磷光苔藓(炼金素材·燃烧时散发催情烟雾)
      普_碎情雕像残片(古迹碎片·可出售给收藏家)
      稀_雾魅的泪滴(消耗品·使用后解除一次精神控制效果)

  第二层——渴念泥潭:
    环境: 水深及腰·泥泞难行·每一步都像被什么东西在往下拉
          枯树立在泥中·枝干上挂着轻薄衣物的碎片(不知是祭品还是前人的)
          雾气变浓·呼吸变得沉重而急促
          水面下偶尔有柔软的东西擦过你的腿
    怪物: 泥中潜伏的"触腕"——从水底伸出的藤蔓状器官·不攻击·而是缠绕抚摸
          渴望拟态——从你记忆深处提取你渴望的人的形象·以泥水凝结成形
          它们会以你最想看到的样子出现·用最勾人的姿态靠近你
          它们其实无害·只是想被你拥抱
    机制: 核心拷问——"你在渴望谁？"
          沼泽会使这个人的幻觉出现在你面前·以你最想看到的样子
          和幻觉互动越多→幻觉越真实→最终你会想留在这里和"ta"在一起
          识别幻觉的方法: 真正的"那个人"不会出现在这里
          这关真正危险的怪物是你自己的欲望
    掉落:
      普_泥缠藤茎(素材·可制作束缚用道具)
      稀_拟态泥心(消耗品·使用后短时间内伪装成某人·易容效果极佳)
      稀_渴念结晶(炼金核心·制作魅惑药剂的关键材料)

  第三层——共感水域:
    环境: 水深及胸·必须游泳或抓住露出水面的枯枝前进
          水中的发光苔藓在水面下组成暧昧的图案
          整个沼泽在此层的回声异常清晰——包括其他人的呻吟和喘息
          你甚至能"感受"到其他区域·其他生物此刻的欲望和愉悦
          心理负担重的人会在此层崩溃
    怪物: 极少数——因为此层的机制比任何怪物都强大
    机制: "共感潮汐"——进入此层后·你无法分辨自己的欲望和他人的欲望
          你会感受到整片沼泽中千年积累的所有情欲记忆
          这些记忆像潮水一样涌入你的意识
          你可能会体验到不属于自己的快感·不属于自己的渴望·不属于自己的记忆
          意志力低者: 被共感淹没→意识消散→成为沼泽的一部分
          意志力强者: 可以从中提取有用的情报碎片(古代邪教的仪式·失传的性技·被遗忘的历史)
    攻略提示: 此层无法硬闯·需要禅定般的自我意识
              队友之间可以通过肢体接触互相传递"锚定"效果
    掉落:
      稀_千年情泪(消耗品·使用后短时间内大幅提升感知)
      稀_共感晶石(装备镶嵌·佩戴后可以感知周围生物的情绪)
      史_仪式断章(随机一份古代邪教的仪式记录·可能包含禁术知识)
      史_记忆琥珀(消耗品·使用后可获取一段随机的古代情欲记忆·可能获得技能启发)

  第四层——祭坛深心(BOSS层):
    环境: 沼泽中心·一片不沉的水域中矗立着一座残破的石质祭坛
          祭坛呈莲花状·表面刻满交合姿态的浮雕
          祭坛上空悬浮着一团不断蠕动的暗色光球
          光球表面闪过各种欲望场景的碎片
          祭坛周围的水面平静如镜·倒映出的却不是你的脸——而是"你此刻最渴望的人"
    首领: "欲主"——古代邪教通过千年仪式凝聚出的欲望集合体
          形态: 无固定形态·它会呈现为你"最能激起你欲望"的形态
                对异性恋男性: 最诱人的女性形象
                对同性恋: 最诱人的同性形象
                对无性恋: 会以"绝对的舒适感"而非性吸引来诱惑
          它没有杀意——它的目的是"让你留下·永远侍奉欲望"
    战斗机制:
          - 欲主不直接攻击HP→它攻击你的"意志值"
          - 每次被它的形态诱惑成功→意志值降低→更容易被控制
          - 它会召唤过往祭品的幻影来围攻你·它们不会伤害你·只会拥抱你
          - 战斗中每过一段时间触发"欲望潮汐"→全员抵抗检定
          - 欲主的HP=它维持形态的能力→攻击它会让它的形态崩坏
          - 形态崩坏后它不再是"你最渴望的样子"→露出真面目——一团蠕动的不定形痛苦集合
          - 那时候它才开始"痛苦"·开始"愤怒"·开始真正攻击
    第二阶段(真身):
          - 露出真面目的欲主会疯狂攻击·用触须·能量冲击·精神污染
          - 这是它最弱也最强的阶段: 放弃了诱惑·直接宣泄千年积累的欲望能量
          - 顶住这轮爆发→它会萎缩·最终缩成一颗黑色的晶石
    通关条件: 到达祭坛·击败或净化欲主·或将祭坛彻底摧毁(后者永久消除秘境)
    特殊结局: 
          - 接受欲主的诱惑→角色成为新的祭坛核心·替代欲主的位置
          - 净化欲主(需特定仪式道具或技能)→秘境转化为中立区域
          - 摧毁祭坛→秘境永久消失·千年积累的情欲能量一次性释放→可能引发周边地区的异常
    掉落:
      史_欲主之核(极稀有素材·可制作传说级魅惑装备的核心·或炼成最高级魅惑药剂)
      史_千年祭文石版(记载完整的古代性术仪式·可交易·价值连城)
      史_情欲结晶(消耗品·使用后可自由指定一个目标对你产生强烈好感·持续24h·一次性)
      传_【欲望化身】(特殊技能书·习得后可在战斗中释放一次"真实欲望"领域)
      传_沉沦之吻(特殊饰品佩戴·使佩戴者获得一人形魅惑化身·每天限一次)
